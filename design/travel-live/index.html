.cv-inline-action{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:44px;padding:6px 0;background:transparent;color:var(--primary);font-size:13px;font-weight:600;text-align:left}
.cv-demo-note,.cv-local-note{font-size:12px;line-height:1.8;color:var(--muted);margin-top:20px;overflow-wrap:anywhere}
.cv-demo-note{margin-top:28px}
.cv-empty{padding:32px 0 0}
.cv-empty h2{font-size:17px;font-weight:600;line-height:1.7}
.cv-empty>p{font-size:14px;color:var(--muted);line-height:1.9;margin:10px 0 28px}
.cv-sample-action{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;min-height:48px;background:transparent;font-size:13px;color:var(--primary);margin-top:5px;padding:8px}
.cv-task{margin-top:24px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.cv-row-title{display:flex;align-items:center;gap:8px}
.cv-row-title h2,.cv-resume h2{font-size:16px;line-height:1.6;font-weight:600}
.cv-task>p{font-size:13px;line-height:1.8;margin-top:9px;color:var(--muted)}
.cv-task>.cv-secondary-copy{font-size:12px;margin-top:4px}
.cv-task>.cv-inline-action{margin-top:5px}
.cv-resume{padding:18px 0;border-bottom:1px solid var(--line);margin-top:10px}
.cv-resume p{color:var(--muted);font-size:12px;line-height:1.8;margin-top:5px}
.cv-saved-trip{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:118px;padding:12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);margin-top:24px}
.cv-saved-trip>img{width:78px;height:92px;flex:none;object-fit:cover;border-radius:10px}
.cv-saved-trip>.icon{margin-left:auto}
.cv-saved-copy{display:flex;flex-direction:column;gap:6px;min-width:0}
.cv-saved-copy>strong{font-size:16px;line-height:1.6;font-weight:650;overflow-wrap:anywhere}
.cv-saved-copy>span{font-size:12px;color:var(--muted);line-height:1.5;overflow-wrap:anywhere}
.cv-saved-copy>.cv-pending-copy{color:var(--warning)}
.cv-new-trip{margin-top:22px}
.cv-request{margin-top:25px}
.cv-request>label,.cv-field>label{display:block;font-size:14px;line-height:1.6;font-weight:600;margin-bottom:9px}
.cv-request textarea{display:block;width:100%;min-height:122px;resize:vertical;padding:13px 14px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;font-size:16px;line-height:1.75;caret-color:var(--primary)}
.cv-request textarea::placeholder,.cv-field input::placeholder{color:var(--muted);opacity:1}
.cv-request textarea::selection,.cv-field input::selection{background:var(--light);color:var(--ink)}
.cv-parse-row{display:flex;align-items:center;justify-content:space-between;gap:9px;min-height:48px}
.cv-parse-row>span{font-size:12px;color:var(--muted);line-height:1.6}
.cv-parse-row>.cv-inline-action{flex:none}
.cv-required{margin-top:17px}
.cv-required>h2{font-size:17px;font-weight:650;line-height:1.7;margin-bottom:17px}
.cv-field{min-width:0;margin-top:16px}
.cv-field input:not([type=checkbox]),.cv-field select{width:100%;max-width:100%;display:block;min-height:49px;margin:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-size:16px;line-height:1.5;padding:10px 12px;caret-color:var(--primary);font-variant-numeric:tabular-nums}
.cv-field input:disabled{color:var(--muted);background:var(--bg);opacity:.7}
.cv-field input[type=date],.cv-field input[type=time]{min-width:0}
.cv-field input::-webkit-date-and-time-value{min-height:24px;text-align:left}
.cv-field-note{font-size:12px;line-height:1.8;color:var(--muted);margin-top:7px}
.cv-date-days{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:12px}
.cv-number-field{position:relative}
.cv-number-field>input{padding-right:30px!important;-moz-appearance:textfield;appearance:textfield}
.cv-number-field>input::-webkit-inner-spin-button,.cv-number-field>input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.cv-number-field>span{position:absolute;right:12px;top:11px;font-size:14px;color:var(--muted);pointer-events:none}
.cv-date-options{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:2px}
.cv-date-options>span{font-size:12px;color:var(--muted)}
.cv-checkbox{display:flex;align-items:center;gap:8px;min-height:44px;font-size:13px;color:var(--muted);cursor:pointer}
.cv-checkbox>input{width:18px;height:18px;flex:none;margin:0;accent-color:var(--primary)}
.cv-conditions{margin-top:22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.cv-disclosure{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:79px;padding:14px 0;background:transparent;text-align:left}
.cv-disclosure>span:first-child{min-width:0}
.cv-disclosure strong{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600}
.cv-disclosure strong>span{font-size:12px;color:var(--muted);font-weight:400}
.cv-disclosure small{display:block;font-size:12px;color:var(--muted);line-height:1.7;margin-top:4px;overflow-wrap:anywhere}
.cv-disclosure-arrow{display:inline-flex;flex:none;transform:rotate(90deg);color:var(--muted)}
.cv-disclosure-arrow.is-open{transform:rotate(-90deg)}
.cv-conditions-panel{padding:0 0 21px}
.cv-conditions-panel[hidden]{display:none}
.cv-conditions-panel>.cv-field:first-child{margin-top:5px}
.cv-two-fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.cv-two-fields .cv-field>label{font-size:13px}
.cv-create-end{font-size:12px;line-height:1.8;color:var(--muted);margin-top:15px}
.cv-form-error,.cv-generation-error{padding:13px 15px;color:var(--warning);background:var(--warning-bg);border-radius:12px;font-size:13px;line-height:1.8;margin-top:18px;overflow-wrap:anywhere}
.cv-generation-notice{font-size:12px;line-height:1.8;color:var(--muted);padding:12px 0 14px;margin-top:10px;border-bottom:1px solid var(--line)}
.cv-stages{list-style:none;margin:25px 0 0;padding:0}
.cv-stages>li{position:relative;display:flex;align-items:flex-start;gap:14px;padding-bottom:24px;min-height:94px}
.cv-stages>li:not(:last-child)::after{content:"";position:absolute;left:14px;top:34px;bottom:5px;width:1px;background:var(--line)}
.cv-stage-number{display:flex;align-items:center;justify-content:center;flex:none;width:30px;height:30px;border:1px solid var(--line);border-radius:50%;font-size:13px;line-height:1;color:var(--muted);font-variant-numeric:tabular-nums}
.cv-stages>li>div{min-width:0;padding-top:1px}
.cv-stages strong{font-size:15px;line-height:1.8;font-weight:500;color:var(--muted)}
.cv-stages p{font-size:12px;line-height:1.8;color:var(--muted);margin-top:3px}
.cv-stage-state{display:block;font-size:12px;line-height:1.8;color:var(--muted);margin-top:3px}
.cv-stages>.is-current .cv-stage-number{border-color:var(--primary);background:var(--primary);color:var(--on-primary)}
.cv-stages>.is-current strong{font-weight:650;color:var(--ink)}
.cv-stages>.is-current .cv-stage-state{color:var(--primary)}
.cv-stages>.is-complete .cv-stage-number{color:var(--primary);border-color:var(--line);background:var(--light)}
.cv-stages>.is-complete strong{color:var(--ink)}
.cv-generation-error{margin-top:0;margin-bottom:22px}
.cv-generation-error h2{font-size:14px;line-height:1.8;font-weight:600}
.cv-generation-error p{margin-top:4px}
.cv-input-summary{border-top:1px solid var(--line);padding-top:19px;margin-top:2px}
.cv-input-summary h2{font-size:15px;font-weight:600;line-height:1.8}
.cv-trip-summary{font-size:13px;line-height:1.8;margin-top:8px;overflow-wrap:anywhere}
.cv-input-summary dl{margin:11px 0 0}
.cv-input-summary dl>div{display:flex;align-items:baseline;gap:12px;font-size:12px;line-height:1.8;margin-top:7px}
.cv-input-summary dt{color:var(--muted);flex:0 0 72px}
.cv-input-summary dd{margin:0;overflow-wrap:anywhere;min-width:0}
.cv-recovery-actions{display:flex;flex-direction:column;gap:9px;margin-top:24px}
.cv-recovery-actions .btn{font-size:15px}
.cv-progress-links{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 12px;margin-top:15px}
.cv-quiet-action{min-height:44px;padding:6px 0;background:transparent;color:var(--muted);font-size:12px}
@media (hover:hover) and (pointer:fine){.cv-inline-action:hover,.cv-sample-action:hover{text-decoration:underline;text-underline-offset:4px}.cv-saved-trip:hover{border-color:var(--primary)}}
@media (max-width:350px){.cv-screen-title h1{font-size:22px}.cv-date-days{grid-template-columns:minmax(0,1fr) 82px;gap:9px}.cv-two-fields{gap:9px}.cv-field input:not([type=checkbox]),.cv-field select{padding-left:10px;padding-right:10px}.cv-parse-row{gap:6px}.cv-parse-row>span{font-size:11px}.cv-saved-trip{gap:9px}.cv-saved-trip>img{width:65px;height:88px}}

/* Scoped result layouts; shared colours and controls come from base.css. */
.rv-result{min-width:0;font-size:14px;overflow-wrap:anywhere}
.rv-result button{max-width:100%}
.rv-trip-heading h1{font-size:25px;line-height:1.45;letter-spacing:-.5px;font-weight:700}
.rv-trip-heading>p{font-size:13px;color:var(--muted);margin-top:6px}
.rv-conditions{display:flex;align-items:center;justify-content:space-between;gap:9px;width:100%;min-height:48px;padding:9px 0;background:transparent;text-align:left;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);margin-top:7px}
.rv-conditions>span{display:flex;align-items:flex-start;gap:7px;min-width:0;line-height:1.8}
.rv-conditions>span>.icon{margin-top:3px}
.rv-conditions i{font-style:normal;color:var(--muted)}
.rv-source-summary{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:48px;background:transparent;text-align:left;font-size:12px;color:var(--muted);padding:6px 0;margin-bottom:9px}
.rv-source-summary>span{display:flex;align-items:center;gap:6px;min-width:0}
.rv-source-summary>span:last-child{color:var(--primary);flex-shrink:0}
.rv-pending{background:var(--warning-bg);border-radius:12px;margin:0 0 20px;padding:11px 13px 2px;color:var(--warning)}
.rv-pending-heading{display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:2px}
.rv-pending-heading strong{font-weight:550}
.rv-pending>button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:56px;background:transparent;padding:6px 0 10px;text-align:left}
.rv-pending>button+button{border-top:1px solid var(--line)}
.rv-pending>button strong{display:block;font-size:14px;font-weight:650}
.rv-pending>button small{display:block;font-size:11px;line-height:1.7;margin-top:2px}
.rv-pending-cta{display:flex;align-items:center;gap:2px;white-space:nowrap;font-size:12px}
.rv-highlights{margin-top:5px}
.rv-highlights .section-heading{margin-bottom:9px;min-height:44px}
.rv-highlights .section-heading h2{font-size:17px;line-height:1.5}
.rv-highlights .carousel-controls{flex:none}
.rv-highlights .carousel-controls .icon-btn{min-width:44px;width:44px}
.rv-highlights .carousel-controls>span{min-width:25px;text-align:center;font-variant-numeric:tabular-nums}
.rv-photo-track{padding-top:3px;padding-bottom:5px;scroll-padding-left:0;scroll-behavior:smooth}
.rv-photo-card{flex-basis:calc(100% - 27px);border-radius:18px;max-width:330px}
.rv-photo-card .photo-wrap{height:181px}
.rv-photo-card .photo-wrap img{height:100%;width:100%;object-fit:cover}
.rv-photo-card .photo-day{font-size:11px;line-height:1.5}
.rv-photo-card .photo-caption{padding:13px 15px 12px}
.rv-photo-card .photo-caption h3{font-size:19px;line-height:1.55}
.rv-photo-card .photo-caption p{font-size:14px;line-height:1.75;margin:5px 0 9px;-webkit-line-clamp:3;min-height:49px}
.rv-photo-card .photo-caption>span{font-size:11px;line-height:1.7}
.rv-swipe-hint{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.7}
.rv-quick-facts{margin:23px 0 25px}
.rv-quick-facts .fact-row{font-size:14px;min-height:58px}
.rv-quick-facts .fact-row>span{gap:7px}
.rv-quick-facts .fact-row strong{font-size:13px;font-weight:550;text-align:right;min-width:0;gap:5px}
.rv-daily-summary>.section-heading{margin-bottom:8px}
.rv-daily-summary>.section-heading h2{font-size:17px}
.rv-daily-summary>.section-heading>span{font-size:11px;color:var(--muted)}
.rv-day-overview>button{gap:11px;min-height:90px;padding:13px 0}
.rv-day-overview .day-number{align-self:flex-start;margin-top:4px;color:var(--primary);font-size:15px}
.rv-day-overview-copy{min-width:0;flex:1}
.rv-day-overview-copy>strong{font-size:15px;line-height:1.65;font-weight:650}
.rv-day-overview-copy>small{font-size:12px;line-height:1.8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px}
.rv-day-overview-copy>.rv-day-date{font-size:11px;margin-top:3px}
.rv-day-overview .day-count{font-size:11px;flex-shrink:0;gap:1px}
.rv-bottom-note{font-size:11px;line-height:1.9;margin-top:21px}
.rv-itinerary-controls{display:flex;align-items:flex-start;gap:12px;margin-bottom:20px;min-width:0}
.rv-day-tabs{flex:1;min-width:0;margin:0;gap:6px;overflow-x:auto;padding:3px 1px 4px;scrollbar-width:thin;overscroll-behavior-x:contain}
.rv-day-tabs>button{flex:1 0 54px;min-height:56px;border-radius:10px;padding:7px 5px;font-size:12px;align-content:center}
.rv-day-tabs strong{font-size:13px;font-weight:550;white-space:nowrap}
.rv-day-tabs span{font-size:11px;line-height:1.7}
.rv-view-switch{display:flex;background:var(--light);border-radius:10px;padding:3px;flex-shrink:0;margin-top:3px}
.rv-view-switch>button{min-height:50px;min-width:44px;padding:6px 10px;background:transparent;border-radius:8px;color:var(--muted);font-size:13px}
.rv-view-switch>button[aria-pressed=true]{background:var(--surface);color:var(--ink);font-weight:650}
.rv-day-heading h1{font-size:22px;line-height:1.5;letter-spacing:-.35px}
.rv-day-heading p{font-size:12px;color:var(--muted);margin:5px 0 15px;line-height:1.8}
.rv-day-tools{display:flex;gap:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 0;margin-bottom:21px}
.rv-day-tools>button{display:flex;align-items:center;justify-content:center;gap:6px;background:transparent;flex:1;min-height:44px;font-size:13px;color:var(--primary);padding:6px 4px}
.rv-day-tools>button+button{border-left:1px solid var(--line)}
.rv-timeline{margin-top:0}
.rv-stop{gap:16px;scroll-margin-top:14px}
.rv-stop .stop-time{flex:0 0 42px;font-size:13px;line-height:44px;font-variant-numeric:tabular-nums}
.rv-stop .timeline-dot{right:-12px;top:18px}
.rv-stop .stop-info{padding-left:7px;padding-bottom:12px}
.rv-stop .stop-heading{gap:0;flex-wrap:wrap}
.rv-stop .stop-title{font-size:17px;line-height:1.5;min-height:44px;max-width:100%;padding:8px 0;flex:1 1 115px}
.rv-stop-actions{display:flex;flex-shrink:0;margin-right:-7px}
.rv-stop-actions .icon-btn{width:44px;min-width:44px;height:44px;color:var(--muted)}
.rv-node-badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px;min-height:0}
.rv-node-badges:empty{display:none}
.rv-node-badges>span{font-size:11px;line-height:1.7;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted);font-weight:400}
.rv-node-badges>.rv-fixed{background:var(--light);border-color:transparent;color:var(--ink)}
.rv-node-badges>.rv-unresolved{background:var(--warning-bg);border-color:transparent;color:var(--warning)}
.rv-stop .stop-meta{font-size:11px;line-height:1.8;margin:1px 0 7px}
.rv-stop .stop-note{font-size:14px;line-height:1.8;margin-bottom:1px}
.rv-stop .inline-confirm{min-height:44px;max-width:100%;font-size:13px;line-height:1.6;white-space:normal;padding:9px 10px;margin-top:10px}
.rv-stop .rv-locate{font-size:12px;min-height:44px;padding:5px 0;white-space:normal;justify-content:flex-start}
.rv-stop .source-chips{margin-top:1px}
.rv-result .source-chips>button{font-size:11px;min-height:44px;white-space:normal;text-align:left;line-height:1.5}
.rv-leg{margin:0;padding:8px 0 13px 65px;line-height:1.8;font-size:11px;min-height:43px}
.rv-stop-selected .timeline-dot{background:var(--primary);box-shadow:0 0 0 3px var(--light)}
.rv-empty-day{padding:20px 0 15px}
.rv-empty-day h2{font-size:19px;line-height:1.6}
.rv-empty-day p{font-size:14px;line-height:1.9;color:var(--muted);margin:8px 0 18px}
.rv-map-heading{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
.rv-map-heading h2{font-size:17px;font-weight:650}
.rv-map-heading>span{font-size:11px;line-height:1.8;color:var(--muted);text-align:right}

.rv-map-unresolved>span{display:flex;gap:5px;align-items:center;min-width:0;line-height:1.7}
.rv-map-unresolved .text-btn{font-size:12px;color:var(--warning);flex-shrink:0}

.rv-result ::selection{background:var(--light);color:var(--ink)}

/* Same-origin API transport. Session credentials remain in memory and cookies. */
const LiveAPI = (() => {
  let csrfToken = '';
  class APIError extends Error {
    constructor(message, code = 'REQUEST_FAILED', status = 0) { super(message); this.name = 'APIError'; this.code = code; this.status = status; }
  }
  async function request(path, {method = 'GET', body, signal} = {}) {
    if (!/^\/api\/(?:session|research|plan|jobs\/[A-Za-z0-9_-]+)$/.test(path)) throw new APIError('请求地址无效。', 'INVALID_PATH');
    const controller = new AbortController();
    const abort = () => controller.abort(signal?.reason);
    if (signal?.aborted) abort(); else signal?.addEventListener('abort', abort, {once: true});
    const timer = setTimeout(() => controller.abort(), 30000);
    try {
      const response = await fetch(path, {method, credentials: 'same-origin', cache: 'no-store', headers: {Accept: 'application/json', ...(body ? {'Content-Type': 'application/json'} : {}), ...(method === 'POST' ? {'X-CSRF-Token': csrfToken} : {})}, ...(body ? {body: JSON.stringify(body)} : {}), signal: controller.signal});
      let data;
      try { data = await response.json(); } catch { throw new APIError('服务返回了无法读取的内容，请稍后重试。', 'INVALID_RESPONSE', response.status); }
      if (!response.ok) throw new APIError(data.error?.message || data.message || '请求没有完成，请重试。', data.error?.code || 'REQUEST_FAILED', response.status);
      return data;
    } catch (error) {
      if (error instanceof APIError) throw error;
      if (signal?.aborted) throw new APIError('已停止查看，服务端任务可能仍在运行。', 'ABORTED');
      throw new APIError(error.name === 'AbortError' ? '连接超时，请重新连接后继续。' : '无法连接本机旅行服务，请确认服务正在运行。', error.name === 'AbortError' ? 'TIMEOUT' : 'NETWORK_ERROR');
    } finally { clearTimeout(timer); signal?.removeEventListener('abort', abort); }
  }
  async function session(options) { const data = await request('/api/session', options); csrfToken = String(data.csrfToken || ''); return data; }
  async function post(path, body, options) { if (!csrfToken) await session(options); if (!csrfToken) throw new APIError('会话尚未就绪，请重新检测连接。', 'SESSION_NOT_READY'); return request(path, {...options, method: 'POST', body}); }
  function delay(ms, signal) { return new Promise((resolve, reject) => { if (signal?.aborted) return reject(new APIError('已停止查看。', 'ABORTED')); const aborted = () => {clearTimeout(timer); reject(new APIError('已停止查看。', 'ABORTED'));}; const timer = setTimeout(() => {signal?.removeEventListener('abort', aborted); resolve();}, ms); signal?.addEventListener('abort', aborted, {once: true}); }); }
  async function poll(id, {onUpdate, signal, interval = 1200, maxWait = 20 * 60 * 1000} = {}) {
    const start = Date.now();
    while (Date.now() - start < maxWait) {
      const job = await request('/api/jobs/' + encodeURIComponent(id), {signal});
      if (!['running', 'done', 'failed'].includes(job.status)) throw new APIError('任务状态无效，请重新连接。', 'INVALID_JOB');
      onUpdate?.(job);
      if (job.status === 'failed') throw new APIError(job.error?.message || '任务没有完成，请重试。', job.error?.code || 'JOB_FAILED');
      if (job.status === 'done') return job.result;
      await delay(interval, signal);
    }
    throw new APIError('任务仍未返回结果，可以稍后继续查看。', 'POLL_TIMEOUT');
  }
  const imageURL = image => {const value = typeof image === 'string' ? image : image?.url; return typeof value === 'string' && /^\/api\/images\/[A-Za-z0-9_-]+$/.test(value) ? value : '';};
  const sourceURL = value => {try {const url = new URL(value); return url.protocol === 'https:' && !url.username && !url.password && /(^|\.)(xiaohongshu\.com|xhslink\.com)$/.test(url.hostname) ? url.href : '';} catch {return '';}};
  return {session, research: (destination, options) => post('/api/research', {destination, count: 3}, options), plan: (researchId, selected, form, options) => post('/api/plan', {researchId, selected, form}, options), job: (id, options) => request('/api/jobs/' + encodeURIComponent(id), options), poll, imageURL, sourceURL, APIError};
})();

function liveBindImages(root = document) {
  root.querySelectorAll('img[data-live-image]').forEach(img => {

/* Live research is the only candidate pool; no cached sample fallback. */
const Discovery = (() => {
  const categories = ['sights', 'food', 'experiences'];
  const initial = () => ({city: '', category: 'sights', query: '', selected: {}, custom: [], researched: false, liveResearch: null});
  const catalog = discovery => Array.isArray(discovery?.liveResearch?.candidates) ? discovery.liveResearch.candidates : [];

  function selected(discovery) {const choices = discovery?.selected || {}; return all(discovery).filter(card => choices[card.id]).map(card => ({...card, priority: choices[card.id]?.priority === 'must' ? 'must' : 'want'}));}
  function validateSelection(discovery) {
    const ids = Object.keys(discovery?.selected || {});
    if (!ids.length) return '请先选择至少一项想去、想吃或想体验的内容。';
    const cards = new Map(all(discovery).map(card => [card.id, card]));
    for (const id of ids) {
      const card = cards.get(id);
      if (!card) return '有选择已不在本次攻略中，请返回清单重新挑选。';
      if (!['want', 'must'].includes(discovery.selected[id]?.priority)) return '请重新设置清单中的优先级。';
      if (!card.title || !categories.includes(card.category)) return '清单内容缺少名称或分类，请重新选择。';
    }
    return '';
  }
  function validatePlan(discovery) {
    const error = validateSelection(discovery);
    if (error) return error;
    if (!discovery.liveResearch?.id) return '请先联网检索攻略，再编排行程。';
    const known = new Set(catalog(discovery).map(card => card.id));
    const unsupported = selected(discovery).filter(card => !known.has(card.id));
    return unsupported.length ? `手动补充的「${unsupported.map(card => card.title).join('、')}」暂不支持首次 AI 编排。内容会保留，请先移出本次选择，生成后可在行程中手动添加。` : '';
  }
  return {initial, catalog, all, selected, validateSelection, validatePlan};

/* Creation, local draft list and generation-state renderers. Events live in app.js. */
function cvDateText(date, undated) {
  if (undated || !date) return '日期待定';
  const parts = String(date).split('-');
  return parts.length === 3 ? `${Number(parts[1])}月${Number(parts[2])}日出发` : String(date);
}

function cvPendingCount(trip) {
  if (!trip) return 0;
  if (Number.isFinite(trip.pendingCount)) return trip.pendingCount;
  const nodes = Array.isArray(trip.nodes) ? trip.nodes : (Array.isArray(trip.days) ? trip.days : []).flatMap(day => day.nodes || day.stops || []);
  return nodes.filter(node => node.locationStatus ? node.locationStatus === 'pending' : node.pending || node.status === 'pending' || node.status === 'unresolved' || node.confirmed === false).length;
}

function cvDayCount(trip, fallback = 3) {
  if (Array.isArray(trip?.days)) return trip.days.length;
  return Number(trip?.dayCount || trip?.days || fallback);
}

function cvTransportValue(value) {
  return ({'公共交通':'公共交通', '步行':'步行', '步行优先':'步行', '自驾':'自驾', '打车为主':'自驾'})[value] || '公共交通';

    const jobForm=job.form||f;

  }
  if (s.editor) {
    content += `<section class="cv-resume" aria-label="未完成的编辑"><div><h2>还有一处修改没完成</h2><p>继续编辑，保留刚才填写的内容。</p></div><button type="button" class="cv-inline-action" data-action="resume-editor">继续编辑${icon('arrow', 17)}</button></section>`;
  }
  if (trip) {
    content += `<article class="cv-saved-trip">${liveImageMarkup(rvAllStops(trip).find(({node})=>LiveAPI.imageURL(node.liveImage||node.image))?.node.liveImage||rvAllStops(trip).find(({node})=>LiveAPI.imageURL(node.liveImage||node.image))?.node.image,{className:'live-saved-thumbnail',caption:false})}<button type="button" class="live-saved-open" data-action="open-trip"><span class="cv-saved-copy"><strong>${esc(trip.title || '旅行草稿')}</strong><span>${esc(cvDateText(trip.date || f.date, trip.undated))} · ${esc(cvDayCount(trip, f.days))}天</span><span class="${pending ? 'cv-pending-copy' : ''}">${pending ? `${pending}处地点待确认` : '查看行程与安排'}</span></span>${icon('arrow', 18)}</button></article>`;
    content += `<p class="cv-local-note">行程保存在当前浏览器，可随时回来继续修改。</p>`;
  }
  if (!trip && !hasJob && !s.editor && !s.discovery?.researched && !s.research) {
    content = `<section class="cv-empty"><h2>下一次旅行，从这里开始</h2><p>输入一个城市，看看当地的攻略，<br>再挑选自己喜欢的内容。</p>${button('开始新的旅行', 'new-trip')}</section>`;
  } else {

  }
  return `<div class="cv-home"><div class="cv-screen-title"><h1>我的行程</h1><p>把想去的地方，变成自己的安排。</p></div>${content}<p class="cv-demo-note">联网检索攻略 · 按已选内容提交 AI 规划</p></div>`;
}

function createBody(s) {

    ${s.planUnplaced?.length ? `<section class="cv-form-error" aria-label="暂未排入的内容"><strong>这些选择仍在清单中，需要调整条件</strong><ul>${s.planUnplaced.map(item => `<li>${esc(typeof item === 'string' ? item : item.title || item.id)}</li>`).join('')}</ul></section>` : ''}
    <section class="cv-required" aria-labelledby="cv-required-title">

      <div class="cv-field"><label for="cv-destination">目的地</label><input id="cv-destination" data-form="destination" type="text" readonly value="${esc(f.destination || '')}" autocomplete="off" maxlength="40" placeholder="填写城市" aria-describedby="cv-destination-note"><p class="cv-field-note" id="cv-destination-note">更换城市请返回发现页重新整理。</p></div>
      <div class="cv-date-days">
        <div class="cv-field"><label for="cv-date">出发日期</label><input id="cv-date" data-form="date" type="date" value="${esc(f.date || '')}" ${f.undated ? 'disabled' : ''} aria-describedby="cv-undated-note"></div>
        <div class="cv-field"><label for="cv-days">玩几天</label><div class="cv-number-field"><input id="cv-days" data-form="days" type="number" inputmode="numeric" min="1" max="5" step="1" value="${esc(f.days || 3)}" aria-describedby="cv-days-note"><span aria-hidden="true">天</span></div></div>
      </div>
      <div class="cv-date-options"><label class="cv-checkbox" for="cv-undated"><input id="cv-undated" data-form="undated" type="checkbox" ${f.undated ? 'checked' : ''}><span id="cv-undated-note">还没定日期</span></label><span id="cv-days-note">支持1–5天</span></div>
    </section>
    <section class="cv-conditions" aria-labelledby="cv-conditions-title">

      <div id="cv-conditions-panel" class="cv-conditions-panel" ${expanded ? '' : 'hidden'}>
        <div class="cv-field"><label for="cv-hotel">酒店名称或所在区域</label><input id="cv-hotel" data-form="hotel" type="text" value="${esc(f.hotel || '')}" maxlength="100" autocomplete="off" placeholder="还没订，可以留空" aria-describedby="cv-hotel-note"><p class="cv-field-note" id="cv-hotel-note">先记下名称，具体位置留到草稿中确认。</p></div>
        <div class="cv-two-fields"><div class="cv-field"><label for="cv-arrival">首日抵达时间</label><input id="cv-arrival" data-form="arrival" type="time" value="${esc(f.arrival || '')}"></div><div class="cv-field"><label for="cv-return">末日返程时间</label><input id="cv-return" data-form="returnTime" type="time" value="${esc(f.returnTime || '')}"></div></div>
        <div class="cv-two-fields"><div class="cv-field"><label for="cv-pace">旅行节奏</label><select id="cv-pace" data-form="pace">${['舒缓', '适中', '紧凑'].map(value => option(value, f.pace || '舒缓')).join('')}</select></div><div class="cv-field"><label for="cv-mode">主要交通</label><select id="cv-mode" data-form="mode">${[['公共交通','公共交通'], ['步行','步行优先'], ['自驾','打车为主']].map(([value,label]) => `<option value="${value}" ${value === cvTransportValue(f.mode) ? 'selected' : ''}>${label}</option>`).join('')}</select></div></div>
      </div>
    </section>
    ${s.error ? `<div class="cv-form-error" role="alert">${esc(s.error)}</div>` : ''}

function progressBody(s) {
 const job=s.job||{status:'paused'},f=job.form||s.form||{},failed=job.status==='failed',paused=job.status==='paused';
 const title=failed?'行程暂未编排完成':paused?'行程任务已保留':job.status==='done'?'旅行草稿已整理好':'AI 正在安排行程';
 return `<div class="cv-progress"><div class="cv-screen-title"><h1>${title}</h1><p>按你选择的内容与出行条件编排。</p></div><section class="live-plan-progress" ${job.status==='running'?'aria-busy="true"':''}><p role="status">${esc(job.progress||'等待服务返回进度…')}</p><span>这里显示服务端返回的实际进度。</span></section>${failed?`<div class="cv-generation-error" role="alert"><h2>需要继续处理</h2><p>${esc(job.error||'任务没有完成，请检查连接后重试。')}</p></div>`:''}<section class="cv-input-summary"><h2>这次旅行的条件</h2><p class="cv-trip-summary">${esc(job.discovery?.city||f.destination||'目的地待填写')} · ${esc(f.days||3)}天 · ${esc(cvDateText(f.date,f.undated))}</p><dl><div><dt>首日抵达</dt><dd>${esc(f.arrival||'时间待定')}</dd></div><div><dt>酒店</dt><dd>${esc(f.hotel||'暂未确定')}</dd></div><div><dt>节奏与交通</dt><dd>${esc(f.pace||'舒缓')} · ${esc(f.mode||'公共交通')}</dd></div></dl></section>${failed||paused?`<div class="cv-recovery-actions">${button(job.resumable||paused?'继续查看任务':'重新提交编排',job.resumable||paused?'resume-job':'retry-job')}${button('返回调整条件','edit-plan-conditions',{secondary:true})}</div>`:''}<div class="cv-progress-links"><button type="button" class="cv-inline-action" data-action="leave-progress">先回我的行程${icon('arrow',16)}</button>${job.status==='running'?'<button type="button" class="cv-quiet-action" data-action="cancel-job">停止查看，保留任务</button>':''}</div><p class="small-note">退出页面不会取消服务端任务；返回后可继续查看。若内容排不下，会保留选择并说明原因。</p></div>`;
}

/* Result views only. All changes are handled by the app's delegated actions. */
function rvAllStops(trip) {
  return (trip.days || []).flatMap((day, dayIndex) => (day.stops || []).map((node, index) => ({node, day, dayIndex, index})));
}

function rvDate(date, short = false) {
  if (!date || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return '';
  const [, month, day] = date.split('-');
  return short ? `${Number(month)}/${Number(day)}` : `${Number(month)}月${Number(day)}日`;
}

function rvDateSummary(trip) {
  const days = trip.days || [];
  const first = days.find(day => rvDate(day.date));
  const last = [...days].reverse().find(day => rvDate(day.date));
  if (trip.undated || !first) return `${days.length}天 · 日期待定`;
  return `${rvDate(first.date)}${last && last.date !== first.date ? ` — ${rvDate(last.date)}` : ''} · ${days.length}天`;
}

function rvConstraintValue(value) {
  if (!value) return '';
  if (typeof value === 'string') return value;
  return [value.label || value.title || value.name || value.place, value.time].filter(Boolean).join(' ');
}

function rvConditions(trip) {
  const c = trip.constraints || {};
  const arrival = rvConstraintValue(c.arrival);
  const returning = rvConstraintValue(c.returnTime || c.return);
  const hotel = rvConstraintValue(c.hotel);
  const pieces = [arrival && `${arrival}到达`, returning && `${returning}返程`, hotel].filter(Boolean);
  return `<button type="button" class="rv-conditions" data-action="conditions" aria-label="查看和修改行程条件"><span>${icon('clock', 16)}<span>${pieces.length ? pieces.map(esc).join('<i aria-hidden="true"> · </i>') : '日期、到达与住宿条件'}</span></span>${icon('arrow', 16)}</button>`;
}

function rvDuration(node) {
  return Number(node.duration) > 0 ? `停留 ${Number(node.duration)} 分钟` : '时长待定';
}

function rvRouteSignature(trip, day) {
  return JSON.stringify([day.date || null, trip.creationForm?.mode || '公共交通', (day.stops || []).map(node => [node.id, node.time, Number(node.duration), node.lng ?? null, node.lat ?? null, node.locationStatus || '', node.verification?.status || '', node.verification?.poiId || ''])]);
}

function rvIncomingLeg(trip, day, index) {
  const previous = day.stops?.[index - 1], current = day.stops?.[index];
  if (!previous || !current || current.travelStatus !== 'estimated') return null;
  if (day.routeEvidenceSignature && day.routeEvidenceSignature !== rvRouteSignature(trip, day)) return null;
  return (day.legs || []).find(leg => leg.fromCandidateId === previous.id && leg.toCandidateId === current.id && leg.status === 'estimated' && Number.isFinite(leg.durationMinutes) && leg.durationMinutes > 0 && leg.durationMinutes <= 1440) || null;
}

function rvTravelGap(previous, current) {
  const start = Model.timeMinutes(previous.time), next = Model.timeMinutes(current.time), duration = Number(previous.duration);
  return Number.isFinite(start) && Number.isFinite(next) && Number.isFinite(duration) ? next - start - duration : null;
}

function rvTravelMode(mode) {
  return ({'步行':'步行', '公共交通':'公共交通', '自驾':'驾车'})[mode] || '交通';
}

function rvTravelConflict(previous, current, leg) {
  const gap = rvTravelGap(previous, current);
  if (gap === null || leg.durationMinutes <= gap) return '';
  return `${gap >= 0 ? `预留${gap}分钟` : `安排已重叠${Math.abs(gap)}分钟`}，地图估计${leg.durationMinutes}分钟，请调整`;
}

function rvLegQueryTime(leg) {
  const date = typeof leg.checkedAt === 'string' ? new Date(leg.checkedAt) : null;
  return date && !Number.isNaN(date.getTime()) ? `<time datetime="${esc(date.toISOString())}">${esc(date.toLocaleString('zh-CN'))}</time>` : '查询时间未提供';
}

function rvLegMarkup(trip, day, index) {
  const leg = rvIncomingLeg(trip, day, index);
  if (!leg) return `<div class="leg rv-leg">${icon('route', 14)}<span>交通待核对${day.routeEvidenceStale ? ' · 安排已修改' : ''}</span></div>`;
  const conflict = rvTravelConflict(day.stops[index - 1], day.stops[index], leg);
  return `<div class="leg rv-leg rv-estimated-leg ${conflict ? 'has-conflict' : ''}">${icon('route', 14)}<div><strong>估计${rvTravelMode(leg.mode)}${leg.durationMinutes}分钟</strong><small>查询于 ${rvLegQueryTime(leg)} · 仅为查询时估计</small>${conflict ? `<p class="rv-leg-conflict">${conflict}</p>` : ''}<small>不保证出行当天耗时，景区内移动与排队未计入。</small></div></div>`;
}

function rvTravelIssues(trip, onlyDayIndex = null) {
  const conflicts = []; let pending = 0, estimated = 0;
  (trip.days || []).forEach((day, dayIndex) => {
    if (onlyDayIndex !== null && onlyDayIndex !== dayIndex) return;
    (day.stops || []).forEach((node, index) => {
      if (!index) return;
      const leg = rvIncomingLeg(trip, day, index);
      if (!leg) { pending++; return; }
      estimated++;
      const previous = day.stops[index - 1], message = rvTravelConflict(previous, node, leg);
      if (message) conflicts.push({dayIndex, previous, node, leg, message});
    });
  });
  return {conflicts, pending, estimated};
}

function rvTravelNotice(trip, onlyDayIndex = null) {
  const {conflicts, pending, estimated} = rvTravelIssues(trip, onlyDayIndex);
  const warnings = !trip.backendWarningsStale && Array.isArray(trip.backendWarnings) ? trip.backendWarnings.filter(warning => typeof warning === 'string' && warning.trim()) : [];
  if (!conflicts.length && !pending && !estimated && !warnings.length && !trip.backendWarningsStale) return '';
  return `<section class="rv-travel-notice ${conflicts.length ? 'has-conflict' : ''}" aria-label="交通时间核对">${conflicts.length ? `<h2>${conflicts.length}处交通时间不足，需要调整</h2>${conflicts.map(issue => `<button type="button" data-action="day-overview" data-index="${issue.dayIndex}"><span><strong>第${issue.dayIndex + 1}天 · ${esc(issue.previous.title)} → ${esc(issue.node.title)}</strong><small>${issue.message}</small></span>${icon('arrow', 16)}</button>`).join('')}` : ''}${pending ? `<p>${trip.backendWarningsStale ? '行程已修改，' : ''}${pending}段交通待核对；预留间隔不代表实际耗时。</p>` : ''}${estimated ? '<p>地图耗时仅为查询时估计，不保证出行当天交通。</p>' : ''}${trip.backendWarningsStale && !pending ? '<p>行程已修改，原编排的交通提醒需重新核对。</p>' : ''}${warnings.length ? `<details><summary>查看编排返回的提醒（${warnings.length}）</summary><ul>${warnings.map(warning => `<li>${esc(warning)}</li>`).join('')}</ul></details>` : ''}</section>`;
}

function rvHasLocation(node) {
  return node.locationStatus !== 'pending' && Number.isFinite(node.lng) && Number.isFinite(node.lat) && Math.abs(node.lng) <= 180 && Math.abs(node.lat) <= 90;
}

function rvLocationLabel(node) {
  if (node.locationStatus === 'pending') return node.kind === 'meal' ? '餐饮地点待确认' : '地点待选';
  if (!rvHasLocation(node)) return node.kind === 'hotel' ? '具体住宿待确认' : '具体位置待确认';
  if (node.locationStatus === 'selected') return '已选择地点';
  if (node.locationStatus === 'manual') return '手动添加地点';
  return '地图位置已返回';
}

function rvBadges(node) {
  return `<div class="rv-node-badges">${node.locked ? '<span class="rv-fixed">固定时间</span>' : ''}${node.mustKeep ? '<span class="rv-fixed">你标记的必选</span>' : ''}${node.manuallyEdited ? '<span>已手动修改</span>' : ''}${node.locationStatus === 'pending' ? `<span class="rv-unresolved">${node.kind === 'meal' ? '餐饮地点待确认' : '地点待选'}</span>` : ''}</div>`;
}

function rvScenicCopy(node) {
  return node.description||node.notes||'根据已选清单编排，具体地点与开放安排仍需核对。';
}

function rvFeatures(trip) {
  const used=new Set();
  return rvAllStops(trip).filter(({node})=>{const url=LiveAPI.imageURL(node.liveImage||node.image);if(!url||used.has(url))return false;used.add(url);return true;}).slice(0,6);
}

function rvPending(trip) {
  const pending = rvAllStops(trip).filter(({node}) => node.locationStatus === 'pending');
  if (!pending.length) return '';
  return `<section class="rv-pending" aria-label="待确认地点"><div class="rv-pending-heading">${icon('pin', 17)}<strong>${pending.length}处地点待确认</strong></div>${pending.map(({node, dayIndex}) => `<button type="button" data-action="confirm" data-id="${esc(node.id)}"><span><strong>${node.kind === 'meal' ? '餐饮地点待确认' : esc(node.title)}</strong><small>第${dayIndex + 1}天 · ${esc(node.time || '时间待定')}${node.kind === 'meal' ? ` · ${esc(node.title)}` : ''}</small></span><span class="rv-pending-cta">去确认${icon('arrow', 15)}</span></button>`).join('')}</section>`;
}

function rvBudgetTotal(budget) {
  if (Number.isFinite(budget)) return budget;
  return Object.values(budget || {}).reduce((total, value) => total + (Number(typeof value === 'object' ? value?.amount : value) || 0), 0);
}

function rvOverview(s) {
  const trip = s.trip, days = trip.days || [], features = rvFeatures(trip), sourceCount = (trip.sources || []).length;
  const photoIndex = Math.max(0, Math.min(features.length - 1, Number(s.carouselIndex) || 0));
  return `<div class="rv-overview">
    <header class="rv-trip-heading"><h1>${esc(trip.title || '我的旅行')}</h1><p>${esc(rvDateSummary(trip))}</p></header>
    ${rvConditions(trip)}
    <button type="button" class="rv-source-summary" data-action="sources"><span>${icon('source', 16)}${sourceCount ? `参考了 ${sourceCount} 篇攻略` : '手动规划 · 暂无攻略来源'}</span><span>查看依据${icon('arrow', 15)}</span></button>
    ${rvTravelNotice(trip)}
    ${rvPending(trip)}
    ${features.length ? `<section class="rv-highlights" aria-label="行程攻略配图"><div class="section-heading"><h2>行程中的攻略配图</h2>${features.length>1?`<div class="carousel-controls"><button type="button" class="icon-btn" data-action="photo-prev" aria-label="上一张攻略配图">${icon('back',18)}</button><span id="photo-count" aria-live="polite">${photoIndex+1}/${features.length}</span><button type="button" class="icon-btn" data-action="photo-next" aria-label="下一张攻略配图">${icon('arrow',18)}</button></div>`:''}</div><div class="photo-track rv-photo-track" id="photo-track" aria-label="左右滑动查看攻略配图">${features.map(({node,dayIndex},index)=>`<article class="photo-card rv-photo-card">${liveImageMarkup(node.liveImage||node.image,{className:'live-feature-image',alt:node.title+'的攻略配图',eager:index===0})}<button type="button" class="photo-caption live-feature-details" data-action="node" data-id="${esc(node.id)}" aria-label="查看${esc(node.title)}的安排"><p class="live-feature-time">第${dayIndex+1}天 · ${esc(node.time||'时间待定')}</p><h3>${esc(node.title)}</h3><p>${esc(rvScenicCopy(node))}</p><span>${icon('clock',14)}${esc(rvDuration(node))}${icon('arrow',17)}</span></button></article>`).join('')}</div><p class="rv-swipe-hint">${features.length>1?'左右滑动查看配图，点照片可看原尺寸':'点照片可看原尺寸'} · 配图未确认是地点实拍</p></section>` : ''}
    <section class="quick-facts rv-quick-facts" aria-label="预算与天气"><button type="button" class="fact-row" data-action="budget"><span>${icon('budget', 19)}自填预算</span><strong>${rvBudgetTotal(trip.budget)>0?money(rvBudgetTotal(trip.budget)):'待填写'}${icon('arrow', 16)}</strong></button><button type="button" class="fact-row" data-action="weather"><span>${icon('weather', 19)}天气与准备</span><strong>${trip.undated || !days.some(day => day.date) ? '确定日期后查看' : '出发前再核对'}${icon('arrow', 16)}</strong></button></section>
    <section class="rv-daily-summary"><div class="section-heading"><h2>每日速览</h2><span>${days.length}天安排</span></div><div class="day-overview rv-day-overview">${days.map((day, index) => {const visits = (day.stops || []).filter(node => !['arrival', 'hotel', 'return'].includes(node.kind));return `<button type="button" data-action="day-overview" data-index="${index}"><span class="day-number">${index + 1}</span><span class="rv-day-overview-copy"><strong>${esc(day.name || `第${index + 1}天`)}</strong><small>${visits.length ? visits.map(node => esc(node.title)).join(' · ') : '还没有安排，可以从这一天开始添加'}</small>${day.date ? `<small class="rv-day-date">${esc(rvDate(day.date))}</small>` : ''}</span><span class="day-count">${(day.stops || []).length}项${icon('arrow', 15)}</span></button>`;}).join('')}</div></section>
    <p class="bottom-note rv-bottom-note">时间和费用为安排建议；开放、预约与交通仍需在出行前核对。</p>
  </div>`;
}

function rvDayControls(s) {
  const days = s.trip.days || [];
  return `<div class="rv-itinerary-controls"><nav class="day-tabs rv-day-tabs" aria-label="选择行程日期">${days.map((day, index) => `<button type="button" data-action="day" data-index="${index}" aria-pressed="${s.activeDay === index}"><strong>第${index + 1}天</strong>${day.date ? `<span>${esc(rvDate(day.date, true))}</span>` : ''}</button>`).join('')}</nav><div class="rv-view-switch" role="group" aria-label="行程显示方式"><button type="button" data-action="view" data-value="list" aria-pressed="${s.view !== 'map'}">列表</button><button type="button" data-action="view" data-value="map" aria-pressed="${s.view === 'map'}">地图</button></div></div>`;
}

function rvDayHeading(s, day) {

  return `<div class="timeline rv-timeline">${stops.map((node, index) => `${index ? rvLegMarkup(s.trip, day, index) : ''}<article class="stop rv-stop ${node.locationStatus === 'pending' ? 'pending-stop' : ''} ${s.selectedId === node.id ? 'rv-stop-selected' : ''}" id="node-${esc(node.id)}" data-node-id="${esc(node.id)}"><div class="stop-time">${esc(node.time || '待定')}<span class="timeline-dot" aria-hidden="true"></span></div><div class="stop-info"><div class="stop-heading"><button type="button" class="stop-title" data-action="node" data-id="${esc(node.id)}">${esc(node.title || '未命名安排')}</button><div class="rv-stop-actions"><button type="button" class="icon-btn" data-action="edit" data-id="${esc(node.id)}" aria-label="编辑${esc(node.title)}">${icon('edit', 17)}</button><button type="button" class="icon-btn" data-action="node-menu" data-id="${esc(node.id)}" aria-label="${esc(node.title)}的更多操作">${icon('more', 18)}</button></div></div>${rvBadges(node)}<p class="stop-meta">${esc(rvDuration(node))} · ${rvLocationLabel(node)}</p>${node.notes ? `<p class="stop-note">${esc(node.notes)}</p>` : ''}${node.locationStatus === 'pending' ? `<button type="button" class="inline-confirm" data-action="confirm" data-id="${esc(node.id)}">${node.kind === 'meal' ? '补充用餐地点' : '选择具体地点'}${icon('arrow', 15)}</button>` : rvHasLocation(node) ? `<button type="button" class="text-btn rv-locate" data-action="locate" data-id="${esc(node.id)}">${icon('pin', 14)}在地图中查看</button>` : ''}${liveSourceChips(node.sourceIds || [])}</div></article>`).join('')}</div><p class="bottom-note rv-bottom-note">“固定时间”会在调整时保留；手动修改只表示你改过安排，开放和路线仍需核对。</p>`;
}

function rvMapPoints(day, zoom) {
  const nodes = (day.stops || []).map((node, index) => ({node, n: index + 1})).filter(({node}) => rvHasLocation(node));
  if (!nodes.length) return [];
  const xs = nodes.map(({node}) => node.lng), ys = nodes.map(({node}) => node.lat);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const spanX = Math.max(.006, maxX - minX), spanY = Math.max(.006, maxY - minY);
  return nodes.map(point => {
    const x = nodes.length === 1 ? 148 : 65 + (point.node.lng - minX) / spanX * 175;
    const y = nodes.length === 1 ? 122 : 188 - (point.node.lat - minY) / spanY * 125;
    return {...point, x: 153 + (x - 153) * zoom, y: 126 + (y - 126) * zoom};
  });
}

function rvMapLines(points) {
  return points.slice(1).filter((point, index) => point.n === points[index].n + 1).map(point => {
    const previous = points[points.indexOf(point) - 1];
    return `<line x1="${previous.x}" y1="${previous.y}" x2="${point.x}" y2="${point.y}" />`;
  }).join('');
}

function rvMapView(s, day) {
  const stops = day.stops || [], zoom = Math.max(.8, Math.min(1.7, Number(s.mapZoom) || 1));

lection" aria-label="已选安排"><div class="rv-map-selection-title"><button type="button" data-action="node" data-id="${esc(selected.id)}">${esc(selected.title)}${icon('arrow', 17)}</button></div><p>${esc(selected.time || '时间待定')} · ${esc(rvDuration(selected))}</p>${rvBadges(selected)}<p class="rv-map-position">${rvLocationLabel(selected)}</p>${liveSourceChips(selected.sourceIds || [])}<div class="rv-map-selection-actions"><button type="button" class="text-btn" data-action="map-list" data-id="${esc(selected.id)}">回列表定位${icon('arrow', 15)}</button><button type="button" class="text-btn" data-action="node" data-id="${esc(selected.id)}">查看安排</button></div></section>` : ''}<p class="bottom-note rv-bottom-note">编号对应当天列表的原顺序。虚线仅连接相邻的已知位置，不代表实际道路、距离或交通耗时。</p>`;
}

function resultBody(s) {

const dvCategories = {
  sights: {label: '景点', wish: '加入想去', must: '必去', want: '想去', group: '想去的地方'},
  food: {label: '美食', wish: '加入想吃', must: '必吃', want: '想吃', group: '想吃的美食'},
  experiences: {label: '体验', wish: '加入想体验', must: '必体验', want: '想体验', group: '想试的体验'}
};

function dvCategory(value) {
  return dvCategories[value] ? value : 'sights';
}

function dvCatalog(s) {
  const d = s.discovery || {};
  const catalog = typeof Discovery.catalog === 'function' ? Discovery.catalog(d) : Discovery.catalog;
  const cards = new Map((Array.isArray(catalog) ? catalog : []).map(item => [item.id, item]));
  for (const item of Array.isArray(d.custom) ? d.custom : []) {
    if (!item?.id || cards.has(item.id)) continue;
    cards.set(item.id, {...item, region: item.region || '自选地点', description: item.description || '你手动补充的心愿。', sourceIds: [], sourceType: 'manual', photo: null});
  }
  return [...cards.values()];
}

function dvSelected(s) {
  const d = s.discovery || {};
  if (typeof Discovery.selected === 'function') return Discovery.selected(d) || [];
  return dvCatalog(s).filter(item => d.selected?.[item.id]).map(item => ({...item, priority: d.selected[item.id].priority || 'want'}));
}

function dvDuration(value) {
  const minutes = Math.max(0, Math.round(Number(value) || 0));
  if (!minutes) return '时长待定';
  const hours = Math.floor(minutes / 60);
  const rest = minutes % 60;
  return `${hours ? `${hours}小时` : ''}${rest ? `${rest}分钟` : ''}`;
}

function dvSourceText(item) {
  if(item.sourceType==='manual'||item.manual)return '手动补充 · 首次 AI 编排暂不支持';
  const ids=item.sourceIds||[];

if(layer.type==='wish-detail'){const item=wishById(layer.id);if(!item)return{title:'候选已移除',body:'<p>可返回继续挑选。</p>',footer:''};const picked=!!s.discovery.selected[item.id];title=item.title;body=`${liveImageMarkup(item.image,{className:'live-sheet-image',alt:item.title+'的攻略配图'})}<p class="sheet-copy">${esc(item.description||item.notes||'由你补充的旅行内容。')}</p><div class="sheet-kv"><span>区域</span><strong>${esc(item.region||'待确定')}</strong></div><div class="sheet-kv"><span>停留参考</span><strong>${Number(item.duration)>0?esc(item.duration)+'分钟':'待确定'} · 未计算交通</strong></div>${item.category==='food'?'<div class="soft-note">先保留感兴趣的美食与餐饮地点，具体用餐安排可在排行程后再确认。</div>':''}${liveSourceChips(item.sourceIds||[],'open-discovery-source')}<p class="small-note">${esc(item.verification?.message||'攻略中的提及不代表营业、票务与路线已核验。')}</p>`;footer=`${button(picked?'从清单移除':item.category==='food'?'加入想吃清单':'加入想去清单','toggle-wish',{attrs:attrs(item.id)})}${button('继续挑选','close-sheet',{secondary:true})}`;}
if(layer.type==='discovery-source'){title='攻略依据';body=discoverySourceBody(layer.id);footer=button('返回继续挑选','close-sheet',{secondary:true});}
if(layer.type==='discovery-sources'){title='这次参考的攻略';body=`<p class="sheet-copy">本次检索获得${liveSources().length}篇攻略。配图保留原帖归属，未确认是候选地点实拍。</p>${liveSourcesList(liveSources(),'open-discovery-source')}`;}
if(layer.type==='add-wish'){title='补充一个想法';body=`${input('custom-wish-title','想去的地方／想吃的内容',layer.title||'','data-layer="title" maxlength="60" placeholder="例如：找一家喜欢的面馆"')}<label class="field-label" for="custom-wish-category">放在哪一类</label><select id="custom-wish-category" class="field" data-layer="category">${[['sights','想去'],['food','想吃'],['experiences','想体验']].map(([value,label])=>`<option value="${value}" ${layer.category===value?'selected':''}>${label}</option>`).join('')}</select>${input('custom-wish-duration','大约停留／分钟',layer.duration||60,'type="number" min="15" max="480" data-layer="duration"')}<p class="small-note">手动补充不会借用攻略出处或位置；首次 AI 编排暂不支持这些内容。内容会保留，生成行程后可手动添加。</p>`;footer=button('加入我的清单','commit-custom-wish');}
if(layer.type==='experience-location'){title='补充这项体验的地点';body=`<h3>${esc(n.title)}</h3><p class="sheet-copy">这里需要的是体验的具体地点。当前没有匹配茶馆、步行起终点的真实搜索结果，可以先手动记下，不会替换成无关景点。</p>${input('experience-place','地点名称或起终点',layer.place||'','data-layer="place" maxlength="100" placeholder="例如：已订茶馆的名称，或沿河步行起点"')}${liveSourceChips(n.sourceIds)}<p class="small-note">保存为手动地点，实际坐标和相邻交通仍待核对。原帖仅作为体验参考，地点由你指定。</p>`;footer=`${button('保存手动地点','commit-experience-place')}${button('先保留待定','close-sheet',{secondary:true})}`;}
if(layer.type==='edit-conflict'){title='还有一处修改未提交';body=`<p class="sheet-copy">“${esc(s.editor?.title||'新安排')}”的输入还在。继续原编辑，或明确放弃后再编辑另一站。</p>`;footer=`${button('继续原来的编辑','keep-original-edit')}${button('放弃原修改，编辑这一站','switch-edit',{secondary:true})}`;}
if(layer.type==='node'){if(!n)return{title:'安排已变更',body:'<p>这项安排已经移除，可以从下方撤销。</p>',footer:''};title=n.title;body=`${liveImageMarkup(n.liveImage||n.image,{className:'live-sheet-image',alt:n.title+'的攻略配图'})}<p class="sheet-copy">${esc(n.notes||'可以添加自己的备注。')}</p><div class="sheet-kv"><span>安排</span><strong>${dayLabel(n.dayIndex)} · ${esc(n.time)} · ${esc(n.duration)}分钟</strong></div><div class="sheet-kv"><span>位置状态</span><strong>${rvLocationLabel(n)}</strong></div>${n.locked?'<div class="soft-note">这是固定安排。调整建议会保留；你可以主动编辑。</div>':''}${liveSourceChips(n.sourceIds||[])}${n.sourceIds?.length?'':'<p class="small-note">未附加攻略出处。</p>'}<div class="sheet-actions">${button('编辑这一站','edit',{attrs:attrs(n.id)})}${button(n.locationStatus==='pending'?(n.kind==='meal'?'补充用餐地点':'补充具体地点'):'手动更换地点','confirm',{secondary:true,attrs:attrs(n.id)})}${rvHasLocation(n)?button('在位置示意图中查看','locate',{secondary:true,attrs:attrs(n.id)}):''}</div>`;}
if(layer.type==='edit'){const e=s.editor;if(!e)return{title:'没有未完成修改',body:'',footer:''};title=e.isNew?'添加一个安排':'编辑这一站';body=`${layer.discard?`<div class="error-note"><p>这处修改尚未提交，是否放弃？</p><div class="inline-actions">${button('继续编辑','keep-edit',{secondary:true})}${button('放弃修改','discard-edit')}</div></div>`:''}${input('edit-title','安排名称（仅修改显示文字）',e.title,'data-edit="title" maxlength="80"')}<p class="small-note">更换景点或门店请使用“替换实际地点”，避免只改名称却保留旧位置。</p><div class="field-pair"><div>${input('edit-time','开始时间',e.time,'type="time" data-edit="time"')}</div><div>${input('edit-duration','停留／分钟',e.duration,'type="number" min="1" max="720" data-edit="duration"')}</div></div><label class="field-label" for="edit-notes">备注</label><textarea class="field" id="edit-notes" data-edit="notes" rows="3" maxlength="500">${esc(e.notes||'')}</textarea><label class="check-field"><input type="checkbox" data-edit="locked" ${e.locked?'checked':''}>固定时间，AI调整时保留</label>${liveSourceChips(e.sourceIds||[])}<p class="small-note">当前输入会保留到本机；查看出处后返回可继续。点“保存修改”后才更新行程。</p>`;footer=button('保存修改','commit-editor');}
if(layer.type==='source'){title='攻略依据';body=sourceBody(layer.id);footer=button(layers.length>1?'返回刚才的操作':'返回行程','close-sheet',{secondary:true});}
if(layer.type==='sources'){title='参考攻略';body=`<p class="sheet-copy">这些攻略来自本次检索，点击可查看引用与原帖。营业、预约与路线仍需核对。</p>${liveSourcesList(s.trip.sources||[],'open-source')}`;}
if(layer.type==='node-menu'){title=n?.title||'安排操作';body=`<div class="menu-rows"><button data-action="edit" ${attrs(layer.id)}>${icon('edit',19)}编辑时间与备注</button><button data-action="confirm" ${attrs(layer.id)}>${icon('pin',19)}替换实际地点</button><button data-action="move" ${attrs(layer.id)} ${n?.locked?'disabled':''}>${icon('calendar',19)}移动到另一天／调整顺序</button><button data-action="remove" ${attrs(layer.id)} ${n?.locked?'disabled':''}>${icon('minus',19)}移除这一站</button></div>${n?.locked?'<p class="small-note">固定安排先在编辑中取消固定，才能移动或移除。</p>':'<p class="small-note">移除、移动后可以撤销，其他固定安排保持不变。</p>'}`;}
if(layer.type==='move'){title='移动与调整顺序';body=`<h3>${esc(n.title)}</h3><label class="field-label" for="move-day">放在哪一天</label><select class="field" id="move-day" data-layer="targetDay">${s.trip.days.map((d,i)=>`<option value="${i}" ${Number(layer.targetDay)===i?'selected':''}>${dayLabel(i)} · ${esc(d.name)}</option>`).join('')}</select>${input('move-time','新的开始时间',layer.targetTime,'type="time" data-layer="targetTime"')}<p class="small-note">按开始时间排序。只移动这一站；固定安排不会顺延。时间冲突时会指出具体安排。</p>`;footer=button('移动并保存','commit-move');}
if(layer.type==='confirm'){title='手动补充具体地点';body=`<p class="sheet-copy">${esc(n.title)}</p><p class="small-note">可以记下实际地点名称。这里不会提供未经检索的门店或坐标。</p>${input('manual-place','地点或门店名称',layer.place||'','data-layer="place" maxlength="100"')}${liveSourceChips(n.sourceIds||[])}<p class="small-note">更换地点后将清除旧坐标、配图与来源关联，原行程可撤销恢复。</p>`;footer=`${button('保存手动地点','commit-manual-place')}${button('先保留原安排','close-sheet',{secondary:true})}`;}
if(layer.type==='ai'){title='规则调整建议';body=`<p class="sheet-copy">先说清改哪部分，再查看具体变化。固定项和手动修改默认保留。</p><label class="field-label" for="ai-scope">调整范围</label><select id="ai-scope" class="field" data-layer="scope"><option value="day" ${layer.scope==='day'?'selected':''}>${dayLabel(s.activeDay)}全部可调整项</option><option value="remaining" ${layer.scope==='remaining'?'selected':''}>${dayLabel(s.activeDay)}剩余安排</option><option value="trip" ${layer.scope==='trip'?'selected':''}>整趟行程</option></select><label class="field-label" for="ai-prompt">想怎么调整</label><textarea class="field" id="ai-prompt" rows="3" data-layer="prompt" placeholder="例如：少走一点，留出休息时间">${esc(layer.prompt||'')}</textarea><div class="quick-choices"><button data-action="ai-preset" data-value="少走一点，留出休息时间">少走一点</button><button data-action="ai-preset" data-value="晚出发一小时">晚出发一小时</button></div><p class="small-note">此处使用本地规则，支持上述两种意图；不会发起新的 AI 请求。“剩余安排”以当前选中站及其后的安排为范围。</p>`;footer=button('生成变更预览','preview-ai');}
if(layer.type==='ai-preview'){title='查看建议变化';body=proposalBody();footer=`${button('应用这些变化','apply-ai')}${button('放弃建议','discard-ai',{secondary:true})}`;}
if(layer.type==='budget'){title='整趟预计预算';body=`<p class="small-note">人民币 · 自填预算 · 修改后点保存才生效</p>${[['stay','住宿'],['food','餐饮'],['transport','交通'],['tickets','门票与预约'],['misc','其他']].map(([key,label])=>`<div class="budget-input-row"><label for="budget-${key}">${label}</label><input id="budget-${key}" class="field" type="number" inputmode="numeric" min="0" max="100000" data-budget="${key}" value="${layer.budget[key]}"></div>`).join('')}<p class="small-note">门票为0表示待核对，不代表免费。尚未接入报价。</p><p class="budget-sum">合计 <strong id="budget-sum">${money(Object.values(layer.budget).reduce((a,b)=>a+Number(b||0),0))}</strong></p>`;footer=button('保存修改','commit-budget');}
if(layer.type==='weather'){title='天气与准备';body=`<div class="soft-note"><h3>${s.trip.undated?'日期未定，先准备随身物品':'临近出发再核对天气'}</h3><p>当前没有接入实时预报，行程不会据此自动更换景点。</p></div><h3 class="section-title">出行准备</h3><div class="prep-list">${[['umbrella','便携雨具'],['shoes','舒适步行鞋'],['booking','证件与预约信息']].map(([key,label])=>`<button data-action="prep" data-key="${key}" aria-pressed="${s.trip.preparation[key]}"><span class="check-box">${s.trip.preparation[key]?icon('check',15):''}</span>${label}</button>`).join('')}</div><p class="small-note">勾选即时保存；在本机重开会保留。</p>`;}
if(layer.type==='conditions'){title='这趟旅行的条件';body=`<div class="condition-details"><p><span>日期</span><strong>${s.trip.undated?'暂未确定':esc(s.trip.date)}</strong></p><p><span>天数</span><strong>${s.trip.days.length}天</strong></p><p><span>到达</span><strong>${esc(s.trip.constraints.arrival||'未指定')}</strong></p><p><span>返程</span><strong>${esc(s.trip.constraints.returnTime||'未指定')}</strong></p><p><span>住宿</span><strong>${esc(s.trip.constraints.hotel||'未指定')}</strong></p></div><p class="small-note">到达、返程、住宿已作为固定安排，可在对应站点主动编辑。整体改日期或天数，请新建一份草稿，旧稿保留。</p>`;footer=button('按新条件再建一份','new-from-trip',{secondary:true});}
if(layer.type==='menu'){title='行程工具';body=`<div class="menu-rows"><button data-action="conditions">${icon('calendar',20)}查看旅行条件</button><button data-action="sources">${icon('source',20)}参考攻略</button><button data-action="budget">${icon('budget',20)}预计预算</button><button data-action="weather">${icon('weather',20)}天气与准备</button><button data-action="export">${icon('export',20)}导出当前行程</button><button data-action="undo" ${s.history.length?'':'disabled'}>${icon('back',20)}撤销上一次修改</button></div>`;}
if(layer.type==='export'){title='导出当前已提交的行程';body=`<p class="sheet-copy">导出到本机，保留待定标记、出处、预算和准备清单。未提交的编辑仍保留在编辑草稿中。</p><div class="export-list"><button data-action="download-txt">${icon('source',22)}<span><strong>可读行程清单</strong><small>TXT，适合直接阅读</small></span>${icon('arrow',17)}</button><button data-action="download-json">${icon('export',22)}<span><strong>完整结构数据</strong><small>JSON，含预算和准备状态</small></span>${icon('arrow',17)}</button></div>`;}
if(layer.type==='node'&&n?.locationNote)body+=`<p class="small-note">${esc(n.locationNote)}</p>`;
return{title,body,footer};}
function sheetMarkup(){if(!layers.length)return '';const {title,body,footer}=sheetContent(currentLayer());return `<div class="sheet-layer"><button class="sheet-scrim" tabindex="-1" data-action="close-sheet" aria-label="关闭面板"></button><section class="sheet" role="dialog" aria-modal="true" tabindex="-1" aria-labelledby="sheet-title"><div class="sheet-handle" aria-hidden="true"></div><header class="sheet-header"><h2 id="sheet-title">${esc(title)}</h2><button class="icon-btn" data-action="close-sheet" aria-label="${layers.length>1?'返回上一层':'关闭面板'}">${icon(layers.length>1?'back':'close',21)}</button></header><div class="sheet-scroll">${sheetError?`<div class="error-note" role="alert">${esc(sheetError)}</div>`:''}${body}</div>${footer?`<footer class="sheet-footer">${footer}</footer>`:''}</section></div>`;}
function readyMarkup(){return s.job?.status==='done'?`<section class="ready-result"><h2>新的行程草稿已整理好</h2><p>刚才的修改保持原样，准备好后再打开新稿。</p><button class="text-btn" data-action="open-archive" ${attrs(s.job.resultId)}>查看新草稿${icon('arrow',16)}</button></section>`:'';}
function archiveMarkup(){return s.otherTrips.length?`<section class="other-trips"><h2>其他已保存的行程</h2>${s.otherTrips.map(x=>`<button data-action="open-archive" ${attrs(x.trip.id)}><span><strong>${esc(x.trip.title)}</strong><small>${x.trip.undated?'日期未定':esc(x.trip.date)} · ${x.trip.days.length}天</small></span>${icon('arrow',16)}</button>`).join('')}</section>`:'';}
function shell(){
 const titles={home:'旅行行程',search:'发现城市',discover:'挑选旅行内容',basket:'我的想去清单',create:'补充出行条件',progress:'编排行程',detail:'旅行详情'};
 const body={home:()=>homeBody(s)+readyMarkup()+archiveMarkup(),search:()=>cityBody(s),discover:()=>discoveryBody(s),basket:()=>(s.basketNotice?`<div class="soft-note">${esc(s.basketNotice)}</div>`:'')+basketBody(s),create:()=>createBody(s),progress:()=>progressBody(s),detail:()=>s.trip?tripSelectionMarkup()+resultBody(s):homeBody(s)}[s.screen]();
 const researchRunning=s.research?.status==='running',researchPaused=s.research?.status==='paused';
 const controls=s.screen==='search'?button(researchRunning?'正在检索攻略':researchPaused?'继续查看攻略任务':'搜索当地攻略',researchPaused?'resume-research':'search-city',{disabled:researchRunning||liveConnection.status==='loading'}):s.screen==='discover'?button(`查看想去清单（${Discovery.selected(s.discovery).length}）`,'to-basket'):s.screen==='basket'?button('下一步，补充出行条件','to-conditions',{disabled:!Discovery.selected(s.discovery).length}):s.screen==='create'?button('让 AI 安排已选内容','generate',{disabled:s.job?.status==='running'}):s.screen==='detail'&&s.lastMutation?`<div class="undo-bar"><span role="status">${esc(s.lastMutation)}</span><button class="text-btn" data-action="undo" ${s.history.length?'':'disabled'}>撤销</button><button class="icon-btn" data-action="dismiss-notice" aria-label="收起操作提示">${icon('close',16)}</button></div>`:'';
 return `<div class="workbench v2-workbench v3-workbench"><aside class="workbench-info"><h1>先选喜欢的<br>再安排行程</h1><p>检索当地攻略，挑选想去和想吃的，再交给 AI 编排。</p><ol><li>输入城市，检索攻略</li><li>浏览景点、美食和体验</li><li>加入清单，标记必选</li><li>补充日期、酒店等条件</li><li>AI 编排已选内容，排不下先说明</li></ol><h2>显示设置</h2><div class="theme-options"><button data-action="theme" data-value="light" aria-pressed="${s.theme==='light'}">暖白</button><button data-action="theme" data-value="dark" aria-pressed="${s.theme==='dark'}">深色</button></div><button class="text-btn" data-action="reopen">重新打开本机草稿</button><p class="workbench-note">检索与 AI 规划需要连接本机旅行服务和网络。选择清单、编辑和草稿保存在本浏览器；本页面不接入 Android。</p></aside><div class="device" data-theme="${s.theme}"><div class="statusbar"><span>MY PLAN</span><span>${icon('wifi',13)}${icon('battery',17)}</span></div><header class="appbar"><button class="icon-btn" data-action="home" aria-label="返回我的行程" ${s.screen==='home'?'disabled':''}>${icon('back',23)}</button><strong>${titles[s.screen]}</strong>${s.screen==='detail'?`<button class="icon-btn" data-action="menu" aria-label="打开行程工具">${icon('more',22)}</button>`:'<span></span>'}</header><div class="save-row"><span class="save-status ${s.saveStatus==='failed'?'failed':''}" role="status">${s.saveStatus==='failed'?'保存失败 · 内容仍在':s.saveStatus==='saved'?'已保存到本机':'本机草稿'}</span>${s.saveStatus==='failed'?'<button class="text-btn" data-action="retry-save">重试保存</button>':'<span>联网旅行规划</span>'}</div>${s.screen==='detail'?`<nav class="main-tabs" role="tablist" aria-label="旅行详情分区">${[['overview','概览'],['itinerary','行程']].map(([id,label])=>`<button id="tab-${id}" data-action="tab" data-value="${id}" role="tab" tabindex="${s.tab===id?0:-1}" aria-selected="${s.tab===id}" aria-controls="phone-scroll">${label}</button>`).join('')}</nav>`:''}<main id="phone-scroll" class="phone-scroll" ${s.screen==='detail'?`role="tabpanel" aria-labelledby="tab-${s.tab}" tabindex="0"`:''}>${liveConnectionMarkup()}${appError?`<div class="error-note" role="alert">${esc(appError)}</div>`:''}${body}</main><footer class="phone-footer ${controls?'':'empty-footer'}">${controls}</footer><div class="home-indicator"><span></span></div>${sheetMarkup()}</div><aside class="design-notes"><h2>从真实攻略到自己的旅行</h2><ul><li>候选来自本次检索</li><li>原帖标题、作者与配图可追溯</li><li>攻略配图不作为地点实拍证明</li><li>选择后才提交给 AI 编排</li><li>未排入内容会明确说明</li><li>草稿可编辑、归档和撤销</li></ul><p>地图仅展示已返回坐标的位置分布；实际道路、营业、预约和交通仍需核对。首次 AI 编排暂不支持手动补充项，生成后可在行程中添加。</p>${liveEvidenceMarkup()}</aside></div>`;
}
function scrollKey(){return `${s.screen}-${s.tab}-${s.view}-${s.activeDay}`;}
let oldScrollKey=null,renderedScreen=null;
function render(reset=false){
 const oldScroll=document.querySelector('#phone-scroll');if(oldScroll&&oldScrollKey)scrolls[oldScrollKey]=oldScroll.scrollTop;

 if(s.focusNode){const row=document.getElementById('node-'+s.focusNode);if(row)scroll.scrollTop=Math.max(0,row.getBoundingClientRect().top-scroll.getBoundingClientRect().top+scroll.scrollTop-14);s.focusNode=null;}
 document.querySelectorAll('.workbench-info,.design-notes,.device > :not(.sheet-layer)').forEach(el=>{el.inert=!!layers.length;});document.documentElement.classList.toggle('v2-modal',!!layers.length);document.documentElement.style.overflow=layers.length?'clip':'';document.body.style.overflow=layers.length?'clip':'';if(layers.length){document.documentElement.scrollTop=0;document.body.scrollTop=0;}
 if(layers.length){if(matchMedia('(max-width:680px)').matches)window.scrollTo(0,0);const sheet=document.querySelector('.sheet');sheet.dataset.type=currentLayer().type;document.querySelector('.sheet-scroll').scrollTop=oldType===currentLayer().type?sheetScroll:currentLayer().scrollTop||0;const focusId=oldType===currentLayer().type?activeId:currentLayer().focus?.id;const retained=focusId&&document.getElementById(focusId);(retained&&sheet.contains(retained)?retained:sheet.querySelector('.sheet-header button')).focus({preventScroll:true});const selection=currentLayer().focus;if(retained&&selection&&typeof retained.setSelectionRange==='function'&&['text','textarea'].includes(retained.type)){retained.setSelectionRange(selection.start||0,selection.end||0);}}
 if(!layers.length){let target=renderedScreen===s.screen?(findControl(activeControl)||(activeId&&document.getElementById(activeId))):null;if(!target){target=document.querySelector('#phone-scroll h1');if(target)target.tabIndex=-1;}target?.focus({preventScroll:true});}renderedScreen=s.screen;

function liveTripTXT(trip){
 const sources=Array.isArray(trip.sources)?trip.sources:[],bySource=new Map(sources.map(source=>[source.id,source]));
 const issues=rvTravelIssues(trip),validLegs=[];
 for(const day of trip.days||[])for(let index=1;index<(day.stops||[]).length;index++){const leg=rvIncomingLeg(trip,day,index);if(leg)validLegs.push(leg);}
 const queryISO=leg=>{const date=typeof leg.checkedAt==='string'?new Date(leg.checkedAt):null;return date&&!Number.isNaN(date.getTime())?date.toISOString():'查询时间未提供';};
 const checked=validLegs.map(queryISO).filter(value=>value!=='查询时间未提供').sort();
 const traffic=[`当前交通核对：${issues.conflicts.length}处时间不足，${issues.estimated}段有地图估计，${issues.pending}段待核对。`];
 for(const issue of issues.conflicts)traffic.push(`第${issue.dayIndex+1}天「${issue.previous.title}」→「${issue.node.title}」：${issue.message}`);
 if(checked.length)traffic.push(`有效估计的查询时间范围：${checked[0]}${checked.at(-1)!==checked[0]?' 至 '+checked.at(-1):''}`);
 if(issues.estimated)traffic.push('地图耗时仅为查询时估计，不保证出行当天交通；景区内移动与排队未计入。');
 if(issues.pending)traffic.push('未取得当前有效估计的路段仍待核对；预留间隔不代表实际交通耗时。');
 if(trip.backendWarningsStale)traffic.push('行程已修改，旧编排提醒已过期；本清单仅列当前可判断的交通问题。');
 else if(Array.isArray(trip.backendWarnings)){const warnings=trip.backendWarnings.filter(value=>typeof value==='string'&&value.trim());if(warnings.length)traffic.push('编排返回的提醒：',...warnings.map(value=>'· '+value));}
 const days=(trip.days||[]).map((day,dayIndex)=>{
  const rows=(day.stops||[]).map((node,index)=>{
   const parts=[];
   if(index){const previous=day.stops[index-1],leg=rvIncomingLeg(trip,day,index);parts.push(`交通：「${previous.title}」→「${node.title}」`);if(leg){parts.push(`估计${rvTravelMode(leg.mode)}${leg.durationMinutes}分钟；查询于 ${queryISO(leg)}。`,`范围：仅为查询时估计，不保证出行当天交通；景区内移动与排队未计入。`);const conflict=rvTravelConflict(previous,node,leg);if(conflict)parts.push('提醒：'+conflict);}else parts.push('交通待核对：没有当前有效的地图估计，预留间隔不代表实际耗时。');}
   const refs=(node.sourceIds||[]).map(id=>{const source=bySource.get(id);return source?`${source.title}${source.author?' / '+source.author:''}`:`${id}（来源详情未提供）`;});
   parts.push(`${node.time||'时间待定'} ${node.title} / ${node.duration||'待定'}分钟${node.locked?' / 固定':''}${node.locationStatus==='pending'?' / 地点待定':''}`,`备注：${node.notes||''}`,`出处：${refs.join('；')||'未附加攻略出处'}`);
   return parts.join('\n');
  });
  return `${dayLabel(dayIndex)} ${day.date||'日期待定'} ${day.name||''}\n`+rows.join('\n\n');
 });
 const references=sources.map(source=>`${source.title||'未命名攻略'} / ${source.author||'作者未提供'} / ${source.date||'日期未提供'}\n原帖：${LiveAPI.sourceURL(source.url)||'原帖链接未提供'}`);
 return [`MY PLAN 联网旅行规划`,trip.title||'我的旅行',trip.undated?'日期待定':trip.date||'日期待定','',traffic.join('\n'),'',days.join('\n\n'),'','参考来源',references.join('\n\n')||'暂无攻略来源','','预算（待核对）',JSON.stringify(trip.budget||{}),'准备清单',JSON.stringify(trip.preparation||{})].join('\n');
}
function exportTrip(type){const data={liveResearch:true,trip:s.trip};const text=type==='json'?JSON.stringify(data,null,2):liveTripTXT(s.trip);const url=URL.createObjectURL(new Blob([text],{type:type==='json'?'application/json;charset=utf-8':'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`MY_PLAN-旅行行程.${type}`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);sheetError='';if(currentLayer())currentLayer().downloaded=true;}

function act(action,el){const id=el?.dataset.id,layer=currentLayer();sheetError='';

if(action==='commit-custom-wish'){if(!String(layer.title||'').trim()){sheetError='先写下想去或想吃的内容。';return render();}const duration=Number(layer.duration);if(!Number.isInteger(duration)||duration<15||duration>480){sheetError='停留时间请填15～480分钟。';return render();}const item={id:'custom-'+Date.now().toString(36),title:layer.title.trim(),category:layer.category,region:'区域待确认',description:'由你手动补充的旅行内容',duration,sourceIds:[],photo:null,sourceType:'manual',notes:''};s.discovery.custom.push(item);s.discovery.selected[item.id]={priority:'want'};layers.pop();persist();return render();}
if(action==='to-basket')return route('basket');

if(action==='home'){if(s.screen==='create')return route('basket');if(s.screen==='basket')return route('discover');if(s.screen==='discover')return route('search');return route('home');}if(action==='leave-progress')return route('home');
if(action==='new-trip'){if(s.job?.status==='running')return route('progress');s.discovery=Discovery.initial();s.research=null;s.form={...Model.fresh().form,prompt:'',destination:'',date:'',undated:true,arrival:'',returnTime:'',hotel:''};return route('search');}if(action==='new-from-trip'||action==='review-wishes'){restoreTripWishes();return route('basket');}
if(action==='open-trip'){s.tab='overview';return route('detail');}
if(action==='open-archive'){const chosen=s.otherTrips.find(x=>x.trip.id===id);if(!chosen)return;const copy=Model.clone(chosen);s.otherTrips=s.otherTrips.filter(x=>x.trip.id!==id);archiveCurrent();s.trip=copy.trip;s.editor=copy.editor;s.history=copy.history||[];s.lastMutation=copy.lastMutation||'';s.form={...Model.fresh().form,...copy.trip.creationForm,days:copy.trip.days.length,undated:copy.trip.undated,date:copy.trip.date||Model.fresh().form.date,...copy.trip.constraints};s.proposal=null;if(s.job?.resultId===copy.trip.id)s.job=null;s.tab='overview';s.activeDay=0;s.selectedId=null;return route('detail');}
if(action==='resume-editor'){s.screen='detail';layers=[];openLayer('edit',s.editor?.id);return;}
if(action==='toggle-conditions'){s.conditionsExpanded=!s.conditionsExpanded;persist();return render();}
if(action==='generate')return startJob();
if(action==='resume-job'||action==='retry-job'){if(!s.job)return;appError='';if(s.job.resumable||s.job.status==='paused'||s.job.status==='running'){if(!s.job.jobId){s.job=null;return startJob();}s.job.status='running';s.screen='progress';planController?.abort();planController=new AbortController();persist();render(true);return runJob();}s.job=null;return startJob();}
if(action==='cancel-job'){planController?.abort();if(s.job){s.job.status='paused';s.job.resumable=!!s.job.jobId;}return route('home');}
if(action==='tab'){s.tab=el.dataset.value;layers=[];persist();render(true);document.getElementById('tab-'+s.tab)?.focus({preventScroll:true});return;}
if(action==='day'||action==='day-overview'){s.activeDay=Number(el.dataset.index);s.selectedId=s.trip.days[s.activeDay].stops[0]?.id||null;s.mapZoom=1;if(action==='day-overview')s.tab='itinerary';persist();return render(true);}

if(action==='photo-prev'||action==='photo-next'){const track=document.querySelector('.rv-photo-track');if(!track)return;track.scrollBy({left:(track.firstElementChild.offsetWidth+12)*(action==='photo-next'?1:-1),behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});return;}
if(action==='node'){const n=findNode(id);if(n){s.selectedId=id;s.activeDay=n.dayIndex;persist();}return openLayer('node',id);}

if(action==='confirm'){const n=findNode(id);if(!n)return;return openLayer('confirm',id,{place:n.experiencePlace||''});}

if(action==='map-node'){s.selectedId=id;persist();return render();}

document.getElementById('app').addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el||el.disabled||(layers.length&&!el.closest('.sheet-layer')))return;act(el.dataset.action,el);});
