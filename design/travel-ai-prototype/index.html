.g-start, .g-draft, .g-start-footer, .g-draft-footer {
  --g-ink: #344331;
  --g-soft: #64735E;
  --g-primary: #65794F;
  --g-light: #E7EDDC;
  --g-white: #fff;
  min-width: 0;
  color: var(--g-ink);
  font-size: 15px;
  line-height: 1.5;
}
.g-start h1, .g-draft h1 {
  margin: 0;
  font-size: 24px;
  font-weight: 650;
  line-height: 1.35;
  letter-spacing: -.025em;
  overflow-wrap: anywhere;
}
.g-intro p {
  margin: 10px 0 0;
  color: var(--g-soft);
  line-height: 1.65;
}
.g-destination {
  margin-top: 28px;
  padding: 20px;
  background: var(--g-white);
  border-radius: 22px;
}
.g-field-heading {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}
.g-field-heading label {
  font-size: 16px;
  font-weight: 600;
}
.g-field-heading > span {
  color: var(--g-soft);
  font-size: 13px;
}
.g-destination-box {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 56px;
  padding: 0 14px;
  border: 1px solid rgba(101, 121, 79, .28);
  border-radius: 14px;
}
.g-field-icon {
  display: flex;
  flex: 0 0 auto;
  color: var(--g-primary);
}
.g-destination-box input {
  width: 100%;
  min-width: 0;
  padding: 12px 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--g-ink);
  font: inherit;
  font-size: 18px;
  font-weight: 550;
  caret-color: var(--g-primary);
}
.g-destination-box input::placeholder {
  color: var(--g-soft);
  font-size: 16px;
  font-weight: 400;
  opacity: 1;
}
.g-destination-box:focus-within {
  outline: 2px solid var(--g-primary);
  outline-offset: 2px;
}
.g-field-help {
  margin: 10px 0 0;
  color: var(--g-soft);
  font-size: 13px;
}
.g-preferences, .g-reference {
  background: var(--g-white);
  border-radius: 22px;
}
.g-preferences {
  margin-top: 16px;
}
.g-preferences > summary, .g-reference > summary, .g-distribution > summary {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 72px;
  padding: 18px 20px;
  border-radius: 22px;
  cursor: pointer;
  list-style: none;
  -webkit-tap-highlight-color: transparent;
}
.g-preferences > summary::-webkit-details-marker,
.g-reference > summary::-webkit-details-marker,
.g-distribution > summary::-webkit-details-marker {
  display: none;
}
.g-preferences > summary:focus-visible,
.g-reference > summary:focus-visible,
.g-distribution > summary:focus-visible {
  outline: 2px solid var(--g-primary);
  outline-offset: 3px;
}
.g-preference-copy, .g-reference-copy {
  display: grid;
  gap: 5px;
  min-width: 0;
}
.g-control-title {
  font-size: 16px;
  font-weight: 600;
}
.g-preference-values, .g-control-description {
  color: var(--g-soft);
  font-size: 14px;
  font-weight: 400;
  line-height: 1.6;
  overflow-wrap: anywhere;
}
.g-disclosure {
  display: flex;
  flex: 0 0 auto;
  margin-left: auto;
  color: var(--g-soft);
}
.g-preferences[open] > summary .g-disclosure,
.g-reference[open] > summary .g-disclosure,
.g-distribution[open] > summary .g-disclosure {
  transform: rotate(90deg);
}
.g-preference-fields {
  padding: 2px 20px 20px;
}
.g-manual {
  margin-top: 26px;
  padding-bottom: 4px;
}
.g-manual p {
  margin: 0 0 10px;
  color: var(--g-soft);
  text-align: center;
  font-size: 14px;
}
.g-manual button, .g-start-footer button, .g-draft-footer button, .g-source-action button {
  width: 100%;
}
.g-trip-overview {
  padding: 2px 0 20px;
}
.g-overview-heading {
  display: flex;
  align-items: center;
  gap: 10px;
}
.g-overview-heading h1 {
  flex: 1;
  min-width: 0;
}
.g-draft-status {
  flex: 0 0 auto;
  padding: 4px 9px;
  border-radius: 8px;
  background: var(--g-light);
  color: var(--g-ink);
  font-size: 12px;
}
.g-summary {
  margin: 9px 0 0;
  color: var(--g-soft);
  font-size: 14px;
  overflow-wrap: anywhere;
}
.g-date-line {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 13px 0 0;
  color: var(--g-soft);
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}
.g-date-line > span:first-child, .g-reference-icon, .g-distribution > summary > span:first-child {
  display: flex;
  flex: 0 0 auto;
  color: var(--g-primary);
}
.g-reference > summary {
  gap: 11px;
  min-height: 82px;
}
.g-reference-body {
  padding: 0 20px 20px;
}
.g-source-action {
  margin-top: 16px;
}
.g-days {
  margin-top: 26px;
}
.g-day-heading {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}
.g-day-heading h2 {
  margin: 0;
  font-size: 20px;
  font-weight: 650;
  line-height: 1.4;
  letter-spacing: -.02em;
}
.g-day-heading p {
  margin: 0;
  color: var(--g-soft);
  font-size: 13px;
}
.g-timeline {
  margin-top: 18px;
}
.g-distribution {
  margin: 20px 0 4px;
  border-radius: 22px;
  background: var(--g-light);
}
.g-distribution > summary {
  min-height: 64px;
}
.g-distribution-body {
  padding: 0 16px 16px;
}
.g-draft-footer {
  display: grid;
  grid-template-columns: 1fr 1.5fr;
  gap: 10px;
  align-items: stretch;
}
.g-draft-footer button {
  min-height: 50px;
  height: 100%;
  padding-right: 10px;
  padding-left: 10px;
}

function chatStart(s, ui) {
  const e = ui.esc;
  const prompt = s.prompt || '';
  const suggestions = [
    { label: '西湖和喝茶', prompt: '杭州玩3天，想逛西湖、喝茶，不要太赶。' },
    { label: '带爸妈慢慢逛', prompt: '杭州玩3天，带爸妈，少走路、多休息。' },
    { label: '以本地小吃为主', prompt: '杭州玩3天，想找本地小吃，景点少一点。' }
  ];

  return {
    body: `
      <section class="c-chat c-start" aria-label="与行程助手讨论旅行">
        <div class="c-assistant-message c-welcome">
          <div class="c-assistant-name">${ui.icon('spark', 18)}<span>MY PLAN 行程助手</span></div>
          <h2>这次想怎么逛${e(s.destination || '杭州')}？</h2>
          <p>想去的地方、同行的人，或不想太赶的节奏，都可以告诉我。</p>
        </div>

        <div class="c-first-composer">
          <label for="c-trip-prompt">说说你的想法</label>
          <textarea id="c-trip-prompt" name="prompt" data-field="prompt" rows="4" maxlength="360" aria-describedby="c-prompt-help" placeholder="比如：杭州玩3天，想逛西湖、喝茶，不要太赶。">${e(prompt)}</textarea>
          <p id="c-prompt-help">先有一个大致想法就好，生成后还能继续商量。</p>
        </div>

        <div class="c-prompt-suggestions">
          <p class="c-section-label">也可以从这里开始</p>
          <div class="c-suggestion-list">
            ${suggestions.map(item => `<button type="button" class="c-suggestion${prompt === item.prompt ? ' c-selected' : ''}" data-action="use-prompt" data-prompt="${e(item.prompt)}" aria-pressed="${prompt === item.prompt}" aria-label="使用想法：${e(item.prompt)}">${e(item.label)}${ui.icon('plus', 15)}</button>`).join('')}
          </div>
        </div>

        <section class="c-preference-context" aria-label="本次旅行的基本安排">
          <div class="c-context-heading">
            <p class="c-section-label">这次旅行</p>
            <button type="button" class="c-text-action" data-action="change-prefs">改偏好${ui.icon('edit', 15)}</button>
          </div>
          <div class="c-shared-summary">${ui.esc(ui.summary(s))}</div>
        </section>
      </section>`,
    footer: `
      <div class="c-chat-footer c-start-footer">
        <p>先给你一版草稿，再一起调整。</p>
        ${ui.button('生成行程草稿', 'generate', { icon: 'spark' })}
      </div>`
  };
}

function chatDraft(s, ui) {
  const e = ui.esc;
  const dayCount = Math.max(1, Number(s.dayCount) || 3);
  const revised = Number(s.revision) > 0;
  const originalPrompt = s.prompt || `去${s.destination || '杭州'}玩${dayCount}天，想按${s.pace || '舒缓'}的节奏逛一逛。`;
  const lastRevision = s.lastChatRevision || '少走一点路';
  const reply = lastRevision.includes('休息')
    ? '好，把休息时间放宽一些。停留点和时长已更新，可以再看看下面这版。'
    : lastRevision.includes('走')
      ? '好，按少走路的方向调整了停留点和时长。你再看看，这样会不会更合适。'
      : `好，已按「${lastRevision}」更新这版安排。下面可以核对调整后的停留点与时长。`;

  return {
    body: `
      <section class="c-chat c-draft" aria-label="旅行共创对话">
        <div class="c-conversation">
          <div class="c-user-message" aria-label="我的旅行想法"><p>${e(originalPrompt)}</p></div>

          <div class="c-assistant-message c-first-reply">
            <div class="c-assistant-name">${ui.icon('spark', 18)}<span>MY PLAN 行程助手</span></div>
            <p>先安排了 ${dayCount} 天，按${e(s.pace || '舒缓')}节奏串起你想去的地方。想少走路或多休息，都可以继续改。</p>
          </div>

          ${revised ? `
            <div class="c-user-message c-revision-request" aria-label="我提出的调整"><p>${e(lastRevision)}</p></div>
            <div class="c-assistant-message c-revision-reply" role="status" aria-live="polite">
              <div class="c-assistant-name">${ui.icon('spark', 18)}<span>MY PLAN 行程助手</span></div>
              <p>${e(reply)}</p>
            </div>` : ''}
        </div>

        <section class="c-result" aria-label="${revised ? '调整后的' : '助手生成的'}行程草稿">
          <div class="c-result-heading">
            <h2>${revised ? '调整后的行程' : `${e(s.destination || '杭州')}行程草稿`}</h2>
            <span>${revised ? `${ui.icon('check', 14)}已更新` : '待你确认'}</span>
          </div>
          <div class="c-result-summary">${ui.esc(ui.summary(s))}</div>
          ${ui.dayTabs(s)}
          <div class="c-result-timeline">${ui.timeline(s)}</div>

          <details class="c-place-distribution">
            <summary>${ui.icon('route', 18)}<span>看看地点分布</span>${ui.icon('arrow', 16)}</summary>
            <div class="c-distribution-content">${ui.distribution(s)}</div>
          </details>

          <div class="c-result-source">${ui.sourceSummary(s)}</div>
          <div class="c-result-actions">
            <button type="button" class="c-text-action" data-action="open-confirm">${ui.icon('pin', 16)}确认地点</button>
            <button type="button" class="c-text-action" data-action="view-sources">${ui.icon('source', 16)}查看来源</button>
          </div>
        </section>

        <section class="c-follow-up" aria-label="继续调整行程">
          <p>这版哪里还想改？</p>
          <div class="c-adjustment-list">
            <button type="button" class="c-adjustment" data-action="revise" data-prompt="少走一点路">少走一点路${ui.icon('plus', 15)}</button>
            <button type="button" class="c-adjustment" data-action="revise" data-prompt="多留一点休息时间">多留一点休息时间${ui.icon('plus', 15)}</button>
          </div>
        </section>
      </section>`,
    footer: `
      <div class="c-chat-footer c-draft-footer">
        <div class="c-reply-composer">
          <label class="c-visually-hidden" for="c-revision-input">继续告诉助手想怎么调整</label>
          <input id="c-revision-input" name="chatRevision" data-field="chatRevision" type="text" maxlength="160" value="${e(s.chatRevision || '')}" placeholder="还想怎么改？" autocomplete="off">
          <button type="button" class="c-send" data-action="revise" aria-label="发送调整想法">${ui.icon('arrow', 21)}</button>
        </div>
        <div class="c-footer-actions">
          ${ui.button('改偏好', 'change-prefs', { secondary: true })}
          ${ui.button('保存行程', 'save', { icon: 'check' })}
        </div>
      </div>`
  };
}

/* 攻略先行：先阅读与选择来源，再检查地点分布和每日安排。 */
function sourcesStart(s, ui) {
  const destination = ui.esc(s.destination || '');
  return {
    body: `
      <section class="a-start" aria-label="先找攻略">
        <div class="a-intro">
          <h1>先看攻略，<br>再决定怎么玩</h1>
          <p>挑你喜欢的内容，再把想去的地方整理成行程。</p>
        </div>

        <div class="a-search-panel">
          <label class="a-field-label" for="a-destination">这次想去哪里</label>
          <div class="a-destination-field">
            ${ui.icon('pin', 23)}
            <input id="a-destination" data-field="destination" type="text" value="${destination}" placeholder="输入城市或目的地" autocomplete="off" aria-label="旅行目的地">
          </div>
          <div class="a-trip-context">${ui.esc(ui.summary(s))}</div>
        </div>

        <details class="a-preferences">
          <summary>
            <span>${ui.icon('calendar', 19)}日期与旅行偏好</span>
            <span class="a-preferences-edit">调整 ${ui.icon('edit', 16)}</span>
          </summary>
          <div class="a-preferences-body">${ui.preferenceFields(s)}</div>
        </details>

        <section class="a-expectations" aria-labelledby="a-before-heading">
          <h2 id="a-before-heading">攻略先读，路线后定</h2>
          <ol class="a-research-steps">
            <li>
              <span class="a-step-number">1</span>
              <div><h3>找到适合这趟旅行的攻略</h3><p>看内容、看出处，再选要参考的几篇。</p></div>
            </li>
            <li>
              <span class="a-step-number">2</span>
              <div><h3>把喜欢的地点放进路线</h3><p>先看地点分布，每天的安排都能修改。</p></div>
            </li>
          </ol>
        </section>
      </section>`,
    footer: `<div class="a-footer">
      ${ui.button('先找旅行攻略', 'collect-sources', { icon: 'search' })}
    </div>`
  };
}

function sourcesSelection(s, ui) {
  const selectedCount = Array.isArray(s.selectedSources) ? s.selectedSources.length : 0;
  const countLabel = selectedCount > 0 ? `已选 ${selectedCount} 篇` : '还没选择攻略';
  return {
    body: `
      <section class="a-selection" aria-label="选择参考攻略">
        <div class="a-intro a-intro-selection">
          <h1>想参考哪些攻略？</h1>
          <p>先读内容，留下你喜欢的几篇。接下来的路线会标出参考出处。</p>
        </div>

        <div class="a-selection-context">${ui.esc(ui.summary(s))}</div>

        <div class="a-sources-heading">
          <h2>为这趟旅行找到的攻略</h2>
          <span class="a-selection-count" role="status" aria-live="polite">${countLabel}</span>
        </div>
        <p class="a-selection-help">${selectedCount > 0 ? '勾选要参考的攻略，也可以打开查看内容。' : '至少选 1 篇，才可以整理路线。'}</p>
        <div class="a-source-catalog">${ui.sourceCards(s)}</div>

        <p class="a-evidence-note">${ui.icon('source', 18)}<span>你选中的攻略会保留在行程里，之后也能回看。</span></p>
      </section>`,
    footer: `<div class="a-footer">
      <p class="a-footer-note">${selectedCount > 0 ? `参考已选的 ${selectedCount} 篇攻略安排路线` : '先选择至少 1 篇攻略'}</p>
      ${ui.button('用选中的攻略规划', 'plan-selected', { icon: 'route', disabled: selectedCount === 0 })}
    </div>`
  };
}

function sourcesDraft(s, ui) {
  const days = Array.isArray(s.days) ? s.days : [];
  const activeDay = Number.isFinite(Number(s.activeDay)) ? Number(s.activeDay) : 0;
  const dayCount = days.length || s.dayCount || 3;
  const dayOverview = days.map((day, index) => {
    const stops = Array.isArray(day.stops) ? day.stops : [];
    const route = stops.map(stop => ui.esc(stop.title || '')).filter(Boolean).join('<span class="a-route-dot" aria-hidden="true">·</span>');
    return `<li class="a-day-overview-row${index === activeDay ? ' a-current-day' : ''}">
      <span class="a-overview-day">第 ${ui.esc(day.day || index + 1)} 天</span>
      <p>${route || '这一天还没有安排地点'}</p>
    </li>`;
  }).join('');

  return {
    body: `
      <section class="a-draft" aria-label="攻略整理成的路线">
        <div class="a-intro a-intro-draft">
          <h1>${ui.esc(s.destination || '目的地')} ${ui.esc(dayCount)} 天路线</h1>
          <p>先看看地点是否顺路，再调整每天想停留的时间。</p>
        </div>
        <div class="a-draft-context">${ui.esc(ui.summary(s))}</div>

        <section class="a-map-section" aria-labelledby="a-map-heading">
          <div class="a-section-heading">
            <h2 id="a-map-heading">先看地点分布</h2>
            <span>按天分组</span>
          </div>
          <div class="a-distribution">${ui.distribution(s)}</div>
        </section>

        ${dayOverview ? `<section class="a-overview" aria-labelledby="a-overview-heading">
          <h2 id="a-overview-heading">每天的路线</h2>
          <ol class="a-day-overview">${dayOverview}</ol>
        </section>` : ''}

        <section class="a-day-details" aria-labelledby="a-details-heading">
          <div class="a-section-heading">
            <h2 id="a-details-heading">把每天安排妥当</h2>
            <span>点击地点可修改</span>
          </div>
          <div class="a-tabs">${ui.dayTabs(s)}</div>
          <div class="a-timeline">${ui.timeline(s)}</div>
        </section>

        <section class="a-route-evidence" aria-labelledby="a-evidence-heading">
          <div class="a-evidence-heading">
            <h2 id="a-evidence-heading">这条路线参考了</h2>
            <button class="a-text-button" type="button" data-action="view-sources">查看攻略 ${ui.icon('arrow', 16)}</button>
          </div>
          <div class="a-source-summary">${ui.sourceSummary(s)}</div>
          <p>每个地点都能找到参考出处，方便你继续判断。</p>
        </section>
      </section>`,
    footer: `<div class="a-footer a-footer-draft">
      ${ui.button('调整偏好', 'change-prefs', { secondary: true, icon: 'edit' })}
      ${ui.button('保存这份行程', 'save', { icon: 'check' })}
    </div>`
  };
}

 if(s.selectedSources.includes('S1')&&s.matches.restaurant==='hubin')places.splice(Math.min(4,places.length),0,{id:'matched-food',title:'杭鸽油爆虾 · 湖滨店',duration:60,sourceIds:['S1'],lng:120.1601,lat:30.2523,note:'你选择的具体门店，可以继续调整到用餐时段。',confirmedByUser:true});
 s.days=Array.from({length:Number(s.dayCount)},(_,index)=>({day:index+1,stops:[]}));
 places.forEach((place,index)=>{const day=Math.min(s.days.length-1,Math.floor(index*s.days.length/Math.max(places.length,1)));s.days[day].stops.push({...clone(place),placeId:place.id,time:'09:00',travelMinutes:null,confirmed:true});});
 s.days.forEach((day)=>{let start=9*60;day.stops.forEach((stop,index)=>{if(/夜市/.test(stop.title))start=Math.max(start,17*60);stop.time=clock(start);stop.travelMinutes=index?(s.mode==='公共交通'?[24,37,19][(index-1)%3]:null):null;start+=stop.duration+(s.pace==='舒缓'?40:25);});});
 for(const {day,stop}of edits){let found=false;for(const current of s.days){const index=current.stops.findIndex((item)=>item.id===stop.id);if(index>=0){current.stops[index]=stop;current.stops.forEach(item=>item.travelMinutes=null);found=true;break;}}if(!found){s.days[Math.min(day,s.days.length-1)].stops.push(stop);} }

 return `<section class="device" aria-label="${MODES[activeVariant].name}手机原型"><div class="statusbar"><span>9:41</span><span class="statusbar-right">${icon('wifi',13)}${icon('battery',16)}</span></div><header class="app-header"><button type="button" class="icon-button" data-action="back" aria-label="返回">${icon('back')}</button><strong>${titles[s.screen]}</strong><button type="button" class="icon-button" data-action="home" aria-label="回到旅行行程">${icon('home',19)}</button></header><main class="phone-body" id="phone-body">${view.body}${s.error&&s.screen!=='edit'?`<p class="phone-feedback" role="alert">${esc(s.error)}${s.error.includes('杭州示例')?`<button type="button" class="quiet-button" data-action="use-demo">使用杭州示例继续</button>`:''}</p>`:''}${s.feedback?`<p class="helper" role="status" style="margin-top:12px">${esc(s.feedback)}</p>`:''}</main><footer class="phone-footer">${view.footer}</footer><div class="home-indicator" aria-hidden="true"><span></span></div></section>`;

function outerMarkup(){const s=currentState,m=MODES[activeVariant];return `<div class="prototype-layout"><aside class="context-panel"><h1>行程 AI<br>交互原型</h1><p>在同一套视觉里，比较三种使用方式。</p><p class="harness-note">演示目的地：杭州。检索、地图、任务恢复和保存均为交互演示，不访问服务、不写入 App。</p><h2>体验流程</h2><nav class="flow-nav" aria-label="原型页面目录">${FLOW_PAGES.map(([screen,label])=>`<button type="button" data-action="jump" data-screen="${screen}" ${s.screen===screen?'aria-current="page"':''}>${label}${icon('arrow',14)}</button>`).join('')}</nav><button type="button" class="harness-reset" data-action="reset-prototype">重置当前流程</button></aside>${renderPhone(s)}<aside class="context-panel right-panel"><h2 style="margin-top:0">${m.axis}</h2><p class="mode-name">${m.name}</p><p>${m.description}</p><h2>这个方向的取舍</h2><p>${m.cost}</p><h2>异常状态演示</h2><select class="control-select" id="demo-scenario" aria-label="选择异常演示"><option value="normal" ${demoScenario==='normal'?'selected':''}>正常生成</option><option value="timeout" ${demoScenario==='timeout'?'selected':''}>检索超时</option><option value="login" ${demoScenario==='login'?'selected':''}>来源登录失效</option><option value="empty" ${demoScenario==='empty'?'selected':''}>没有找到攻略</option></select><p>切换后点“开始规划”，或点左侧“检索异常恢复”。</p><h2>可以重点试试</h2><ul class="coverage"><li>检索时返回，再继续查看</li><li>确认具体地点或先跳过</li><li>修改时间，看看冲突提示</li><li>回看攻略，再保存草稿</li></ul><p>键盘 1–3 或左右方向键切换方案；输入时不会触发。R 重置当前方案。</p></aside></div>`;}
function renderCurrent({keepScroll=false,animate=false}={}){
 const previous=document.querySelector('#phone-body');const scroll=keepScroll?previous?.scrollTop||0:0;
 const openDetails=[...document.querySelectorAll('#stage details[open]')].map((el)=>el.className);
 document.getElementById('stage').innerHTML=outerMarkup();
 if(keepScroll){document.querySelector('#phone-body').scrollTop=scroll;for(const cls of openDetails){const element=[...document.querySelectorAll('#stage details')].find((el)=>el.className===cls);if(element)element.open=true;}}
 const announceError=currentState.error&&currentState.error!==currentState.lastAnnouncedError;
 currentState.lastAnnouncedError=currentState.error;
 if(announceError)requestAnimationFrame(()=>document.querySelector('.phone-body [role="alert"]')?.scrollIntoView({block:'nearest'}));
 if(!keepScroll&&matchMedia('(max-width:680px)').matches)requestAnimationFrame(()=>window.scrollTo({top:0,left:0,behavior:'auto'}));
 if(animate&&!matchMedia('(prefers-reduced-motion:reduce)').matches){const body=document.querySelector('#phone-body');body.classList.add('flow-enter');body.addEventListener('animationend',()=>body.classList.remove('flow-enter'),{once:true});}renderSerial++;
}
function navigate(screen,{push=true}={}){if(push&&screen!==currentState.screen)currentState.history.push(currentState.screen);currentState.screen=screen;currentState.error='';currentState.feedback='';renderCurrent({animate:true});}
function back(){const s=currentState;if(s.screen==='research')return navigate('home');if(s.screen==='start'||s.screen==='saved')return navigate('home');s.screen=s.history.pop()||'start';s.error='';s.feedback='';renderCurrent();}
function validateTrip(){const s=currentState;if(activeVariant===1){if(!s.prompt.trim()){s.error='先说说想去哪儿、玩几天。';renderCurrent({keepScroll:true});return false;}if(!/杭州/.test(s.prompt)){s.error='当前原型提供杭州示例，换成杭州可以体验完整流程。';renderCurrent({keepScroll:true});return false;}const match=s.prompt.match(/([1-5])\s*天/);if(match)s.dayCount=Number(match[1]);s.destination='杭州';}
 if(!s.destination.trim()){s.error='请先填写目的地。';renderCurrent({keepScroll:true});return false;}if(!/杭州/.test(s.destination.trim())){s.error='当前原型提供杭州示例，换成杭州可以体验完整流程。';renderCurrent({keepScroll:true});return false;}if(!/^\d{4}-\d{2}-\d{2}$/.test(s.date)||s.date<'2026-10-28'){s.error='请选择今天或之后的出发日期。';renderCurrent({keepScroll:true});return false;}return true;
}
function startResearch(phase){if(!validateTrip())return;clearInterval(taskTimer);const s=currentState;s.researchPhase=phase||(activeVariant===2?'collect':'plan');if(s.researchPhase==='collect')s.sourcesMode='select';s.researchStep=0;s.researchDone=false;s.taskActive=true;s.saved=false;s.history.push(s.screen);s.screen='research';s.error='';renderCurrent({animate:true});taskTimer=setInterval(()=>{if(currentState!==s){clearInterval(taskTimer);return;}s.researchStep++;if(s.researchStep===2&&demoScenario!=='normal'){s.errorKind=demoScenario;s.taskActive=false;clearInterval(taskTimer);s.screen='error';renderCurrent();return;}if(s.researchStep>=4){s.researchStep=4;s.researchDone=true;s.taskActive=false;clearInterval(taskTimer);if(s.researchPhase!=='collect')arrange(s);}if(['research','home'].includes(s.screen))renderCurrent({keepScroll:true});},650);}
function draftIssues(days){for(const day of days){const intervals=[];for(const stop of day.stops){const start=minutes(stop.time);if(!stop.title.trim())return '请填写安排名称。';if(!Number.isFinite(start)||!Number.isInteger(Number(stop.duration))||Number(stop.duration)<1||Number(stop.duration)>720)return '请填写有效时间和1～720分钟的停留时长。';if(start+Number(stop.duration)>1440)return '这项安排会跨过当天午夜，请调整时间或时长。';intervals.push({start,end:start+Number(stop.duration),title:stop.title});}intervals.sort((a,b)=>a.start-b.start);for(let i=1;i<intervals.length;i++)if(intervals[i].start<intervals[i-1].end)return `“${intervals[i-1].title}”与“${intervals[i].title}”时间重叠，请留出空档。`;}return '';}
function openEdit(id,isNew=false){ensureDraft();const s=currentState;const original=s.days.flatMap((day)=>day.stops).find((stop)=>stop.id===id);s.edit=isNew?{id:'manual-'+Date.now(),title:'',time:'15:00',duration:60,note:'',sourceIds:[],travelMinutes:null,isNew:true}:clone(original);navigate('edit');}
function saveEdit(){const s=currentState,edited={...s.edit,duration:Number(s.edit.duration),manuallyEdited:true,travelMinutes:null};const days=clone(s.days);const day=days[s.activeDay];if(edited.isNew)day.stops.push(edited);else{const index=day.stops.findIndex((stop)=>stop.id===edited.id);day.stops[index]=edited;}const issue=draftIssues(days);if(issue){s.error=issue;renderCurrent({keepScroll:true});return;}day.stops.sort((a,b)=>minutes(a.time)-minutes(b.time));day.stops.forEach((stop)=>stop.travelMinutes=null);s.days=days;s.edit=null;back();s.feedback='修改已保留；这一天的交通时间需要更新。';renderCurrent({keepScroll:true});}
function handle(action,element){const s=currentState;
 if(action==='jump'){const screen=element.dataset.screen;if(screen==='research')return startResearch();ensureDraft();if(screen==='edit'){s.screen='draft';s.history=[];openEdit(s.days[s.activeDay].stops[0]?.id||s.days[0].stops[0]?.id,!s.days.flatMap(d=>d.stops).length);return;}if(screen==='source')s.sourceId='S2';if(screen==='saved'){s.saved=true;s.taskActive=false;clearInterval(taskTimer);}if(screen==='error')s.errorKind=demoScenario==='normal'?'timeout':demoScenario;navigate(screen);return;}
 if(action==='reset-prototype'){clearInterval(taskTimer);currentState=initialState();renderCurrent();return;}
 if(action==='generate'||action==='collect-sources')return startResearch();
 if(action==='home')return navigate('home');if(action==='back')return back();
 if(action==='new-trip'){clearInterval(taskTimer);currentState=initialState();renderCurrent();return;}
 if(action==='resume'){navigate(s.researchDone?(s.researchPhase==='collect'?'sources':'confirm'):'research');if(!s.taskActive&&!s.researchDone){s.researchDone=true;s.researchStep=4;ensureDraft();renderCurrent();}return;}
 if(action==='retry'){demoScenario='normal';return startResearch(s.researchPhase);}
 if(action==='use-cache'){s.cached=true;s.researchDone=true;s.researchStep=4;if(s.researchPhase!=='collect')arrange(s);navigate(s.researchPhase==='collect'?'sources':'confirm');return;}
 if(action==='use-demo'){s.destination='杭州';s.prompt='杭州玩3天，想逛西湖、喝茶，不要太赶。';s.error='';renderCurrent({keepScroll:true});return;}
 if(action==='pref'){const field=element.dataset.field,value=field==='dayCount'?Number(element.dataset.value):element.dataset.value;if(s[field]!==value)s.routesNeedRefresh=true;s[field]=value;renderCurrent({keepScroll:true});return;}
 if(action==='interest'){const value=element.dataset.value;s.interests=s.interests.includes(value)?s.interests.filter(item=>item!==value):[...s.interests,value];renderCurrent({keepScroll:true});return;}
 if(action==='use-prompt'){s.prompt=element.dataset.prompt;renderCurrent({keepScroll:true});return;}
 if(action==='change-prefs')return navigate(s.screen==='error'?'start':'prefs');if(action==='apply-prefs'){const previous=s.history.pop()||'start',changed=s.routesNeedRefresh;if(s.days.length&&s.days.length!==Number(s.dayCount))arrange(s);if(changed&&s.days.length){s.days.forEach(day=>day.stops.forEach(stop=>stop.travelMinutes=null));s.feedback='偏好已更新，原有安排保留；交通时间需要重新估算。';}s.routesNeedRefresh=false;s.screen=previous;renderCurrent();return;}
 if(action==='show-sources'){s.sourcesMode='select';return navigate('sources');}
 if(action==='view-sources'){s.sourcesMode='view';return navigate('sources');}
 if(action==='toggle-source'){const id=element.dataset.source;s.selectedSources=s.selectedSources.includes(id)?s.selectedSources.filter(value=>value!==id):[...s.selectedSources,id];renderCurrent({keepScroll:true});return;}
 if(action==='plan-selected'){if(!s.selectedSources.length)return;return startResearch('plan');}
 if(action==='open-source'){s.sourceId=element.dataset.source;return navigate('source');}
 if(action==='open-confirm'){ensureDraft();return navigate('confirm');}
 if(action==='match'){s.matches[element.dataset.group]=element.dataset.value;renderCurrent({keepScroll:true});return;}
 if(action==='confirm-done'){arrange(s);return navigate('draft');}
 if(action==='skip-confirm'){ensureDraft();return navigate('draft');}
 if(action==='draft'){ensureDraft();return navigate('draft');}
 if(action==='switch-day'){s.activeDay=Number(element.dataset.day);renderCurrent({keepScroll:true});return;}
 if(action==='edit')return openEdit(element.dataset.id);
 if(action==='new-stop')return openEdit('',true);
 if(action==='save-edit')return saveEdit();
 if(action==='find-free-time'){const day=s.days[s.activeDay];const end=Math.max(9*60,...day.stops.filter(stop=>stop.id!==s.edit.id).map(stop=>minutes(stop.time)+Number(stop.duration)));s.edit.time=clock(Math.min(end+30,23*60));s.error='';renderCurrent({keepScroll:true});return;}
 if(action==='start-manual'){s.days=Array.from({length:Number(s.dayCount)},(_,index)=>({day:index+1,stops:[]}));s.matches={leifeng:'later',restaurant:'later'};s.selectedSources=[];s.activeDay=0;s.manual=true;return navigate('draft');}
 if(action==='revise'){const prompt=(element.dataset.prompt||s.chatRevision).trim();if(!prompt){s.error='说说想怎么调整，比如“多留一点休息时间”。';renderCurrent({keepScroll:true});return;}ensureDraft();s.lastChatRevision=prompt;s.chatRevision='';s.revision++;const day=s.days[s.activeDay];if(/走|少|景点/.test(prompt)&&day.stops.length>1)day.stops.pop();else day.stops.forEach(stop=>stop.duration=Math.min(240,stop.duration+15));let start=9*60;day.stops.forEach(stop=>{if(/夜市/.test(stop.title))start=Math.max(start,17*60);stop.time=clock(start);stop.travelMinutes=null;start+=stop.duration+45;});s.error='';renderCurrent({keepScroll:true});return;}
 if(action==='save'){ensureDraft();if(!s.days.some(day=>day.stops.length)){s.error='先加入一个安排，再保存行程。';renderCurrent({keepScroll:true});return;}const issue=draftIssues(s.days);if(issue){s.error=issue;renderCurrent({keepScroll:true});return;}s.saved=true;s.taskActive=false;clearInterval(taskTimer);return navigate('saved');}
}
document.getElementById('stage').addEventListener('click',(event)=>{const element=event.target.closest('[data-action]');if(element&&!element.disabled)handle(element.dataset.action,element);});
document.getElementById('stage').addEventListener('input',(event)=>{const field=event.target.dataset.field;if(field)currentState[field]=event.target.value;const edit=event.target.dataset.editField;if(edit&&currentState.edit)currentState.edit[edit]=event.target.value;});
document.getElementById('stage').addEventListener('change',(event)=>{if(event.target.id==='demo-scenario'){demoScenario=event.target.value;return;}if(event.target.dataset.field&&event.target.type==='date'){currentState.date=event.target.value;currentState.routesNeedRefresh=true;renderCurrent({keepScroll:true});}});
document.getElementById('stage').addEventListener('keydown',(event)=>{if(event.key==='Enter'&&event.target.dataset.field==='chatRevision'){event.preventDefault();handle('revise',{dataset:{}});}});
const variants=[0,1,2].map((index)=>()=>{clearInterval(taskTimer);activeVariant=index;currentState=initialState();if(matchMedia('(max-width:680px)').matches)requestAnimationFrame(()=>window.scrollTo({top:0,left:0,behavior:'auto'}));return outerMarkup();});
history.scrollRestoration='manual';
const initialUrl=new URL(location);const initialVariant=Number(initialUrl.searchParams.get('v'));
if(initialUrl.searchParams.has('v')&&(!Number.isInteger(initialVariant)||initialVariant<1||initialVariant>variants.length)){initialUrl.searchParams.set('v','1');history.replaceState(null,'',initialUrl);}

// `variants` is an array of render functions, one per variant, in picker order.
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
// Enable the slide only after first paint, so load doesn't animate.
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script></body></html>
